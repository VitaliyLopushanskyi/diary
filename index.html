  --gold:#7A5A00; --gold-tint:#FFF4D6; --gold-line:#EFD68A;
  --accent:#3E4440; --accent-tint:#EEF0EC;
  --r-lg:18px; --r-md:14px; --r-sm:11px;
  --shadow:0 1px 2px rgba(22,24,23,.04), 0 4px 14px rgba(22,24,23,.04);
  --focus:0 0 0 4px rgba(22,24,23,.06);
  --on-primary:#FFFFFF; --on-accent:#FFFFFF; --ph:#6E746F; --bar-bg:rgba(233,236,230,.92); --plan-bar:#DCE0DA;
  --sk1:#DFE3DC; --sk2:#ECEEEA; --scrim:rgba(22,24,23,.42);
  --cal1:#A9D4BA; --cal2:#6BB58C; --cal3:#2F8A5B; --cal4:#185A3A;
  /* теплова карта (підходи) і участь м'яза у вправі — одна шкала акценту */
  --heat0:#DEE2DB; --heat1:var(--cal1); --heat2:var(--cal2); --heat3:var(--cal3); --heat4:var(--cal4);
  --lvl1:#1F7A4D; --lvl2:#6BB58C; --lvl3:#A9D4BA; --peak:#5FD99A;
  /* силует: м'яз, шкіра, «борозни» між м'язами (body), світло/тінь для об'єму, тінь під стопами */
  --fig-skin:#EEF0EB; --fig-hair:#CDD2CA; --fig-muscle:#DDE2D9; --fig-body:#BBC2B7; --fig-line:#B7BDB3; --fig-sel:#AEB6AC;
  --fig-hi:#FFFFFF; --fig-lo:#5E665F; --fig-shadow:rgba(40,48,42,.2);
}
/* Темна тема — вмикається перемикачем у шапці (☾ / ☀), атрибут data-theme на <html> */
:root[data-theme="dark"]{
  --bg:#0C0E0D; --surface:#191C1A; --sunk:#222623; --well:#1E2220;
  --primary:#ECEFEC; --secondary:#A9B0AA; --muted:#959C96; --faint:#5C635E; --border:#2C312E;
  --amber-tx:#E8B06A; --red-tx:#F2938C; --dv-nodata-tx:#9BB6C7; --dv-flat-tx:#E6C65F;
  --green:#2E8F5F; --green-dark:#7FCFA2; --green-tint:#163021;
  --red:#F0817A; --red-tint:#3A1E1C; --amber:#E2A55A; --amber-tint:#2C2215; --amber-line:#6A4D22; --amber-edge:#B9843E; --amber-ico:#3A2B15;
  --down:#EDA066; --down-ico:#E8914F; --down-tint:#30231A;
  --gold:#E6C65F; --gold-tint:#2B2512; --gold-line:#5C4D1C;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --focus:0 0 0 4px rgba(236,239,236,.08);
  --on-primary:#111312; --on-accent:#0D110F; --ph:#8C938D; --bar-bg:rgba(12,14,13,.9); --plan-bar:#2C312E;
  --sk1:#1D201E; --sk2:#262A27; --scrim:rgba(0,0,0,.6);
  --cal1:#2D6A4B; --cal2:#3B8C61; --cal3:#5BB584; --cal4:#9FE0BB;
  --accent:#C4CAC5; --accent-tint:#222623;
  --heat0:#3E4440;
  --lvl1:#7FD3A6; --lvl2:#3E9467; --lvl3:#2D6A4B; --peak:#D8FBE6;
  --fig-skin:#343935; --fig-hair:#4B524D; --fig-muscle:#424944; --fig-body:#232724; --fig-line:#1A1D1B; --fig-sel:#66706A;
  --fig-hi:#A6AFA8; --fig-lo:#000000; --fig-shadow:rgba(0,0,0,.45);
}
:root{--dv-flat:#D9A520; --dv-nodata:#93AEBF;}
:root[data-theme="dark"]{--dv-flat:#E3C14E; --dv-nodata:#6D8B9C;}
/* Рожевий акцент (профіль Ліни): ті самі змінні, що й зелений — тому міняється все разом */
:root[data-accent="pink"]{
  --green:#C2477A; --green-dark:#8E2453; --green-tint:#FBEAF1;
  --cal1:#F2B8CF; --cal2:#E27FA6; --cal3:#C2477A; --cal4:#8A1F4C;
  --lvl1:#C2477A; --lvl2:#E27FA6; --lvl3:#F2B8CF; --peak:#F27BAA;
}
:root[data-accent="pink"][data-theme="dark"]{
  --green:#C9578A; --green-dark:#F2A6C6; --green-tint:#3A1C29;
  --cal1:#6E2A47; --cal2:#93395F; --cal3:#C9578A; --cal4:#F5B5D0;
  --lvl1:#F2A6C6; --lvl2:#B24C7A; --lvl3:#6E2A47; --peak:#FFE0EE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
/* Сторінка не «плаває» вбік: тільки вертикальне гортання, без горизонтального зсуву й відскоку */
html, body{overflow-x:hidden; overscroll-behavior-x:none; touch-action:pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{
  font-family:'Manrope',system-ui,sans-serif; background:var(--bg); color:var(--primary);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
  max-width:520px; margin:0 auto; padding:22px 18px 140px; overflow-x:hidden;
}
input,textarea,select,button{font-family:inherit; color:inherit;}
button{cursor:pointer;}
.hidden{display:none !important;}
::selection{background:var(--green); color:var(--on-accent);}
input, textarea{caret-color:var(--green);}
:focus-visible{outline:2px solid var(--green); outline-offset:2px;}
input:focus-visible, textarea:focus-visible{outline:none;}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

/* ═══ HEADER ═══ */
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:20px;}
.top-l{min-width:0;}
.day-tag{display:flex; align-items:center; gap:7px; margin-bottom:4px;}
.day-dot{display:none;}
.kicker{font-size:12px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--secondary);}
.top h1{font-family:var(--display); font-size:clamp(19px, 6.2vw, 27px); font-weight:800; letter-spacing:-.02em; line-height:1.05; text-transform:lowercase;}
.day-st{font-size:12px; font-weight:800; padding:2px 9px; border-radius:10px; background:var(--accent-tint); color:var(--accent);}
.day-st:empty{display:none;}
.date{margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:13px; font-weight:500; color:var(--secondary); font-variant-numeric:tabular-nums;}
.sync{font-size:12px; font-weight:800; letter-spacing:.03em; padding:2px 8px; border-radius:10px; transition:background .2s, color .2s;}
.sync:empty{display:none;}
.sync.run{background:var(--sunk); color:var(--secondary);}
.sync.ok{background:var(--sunk); color:var(--secondary);}
.sync.err{background:var(--red-tint); color:var(--red);}

.switch{position:relative; display:inline-flex; align-items:center; gap:8px; flex-shrink:0;
  background:var(--surface); border:1px solid var(--border); border-radius:22px;
  padding:9px 13px; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; transition:border-color .18s ease;}
.switch:hover{border-color:var(--faint);}
.switch svg{width:9px; height:6px; opacity:.45; flex-shrink:0;}
.switch select{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; cursor:pointer; font-size:16px;}

/* ── tabs ── */
.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:4px; border-radius:14px; background:var(--well); margin-bottom:20px;}
.tabs button{height:36px; border:none; border-radius:10px; background:none; font-size:13px; font-weight:800; color:var(--secondary);
  display:flex; align-items:center; justify-content:center; gap:7px; transition:background .18s ease, color .18s ease;}
.tabs button.on{background:var(--surface); color:var(--primary); box-shadow:var(--shadow);}
.tabs .dot{width:6px; height:6px; border-radius:50%; background:var(--amber);}


/* ═══ ПРОГРАМА ═══ */
.prg-empty{padding:40px 0; text-align:center; color:var(--secondary); font-weight:600;}
.prg-days{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:6px; margin-bottom:12px;}
.prg-days button{padding:9px 4px; border-radius:12px; border:1px solid var(--border); background:var(--surface); font-size:13.5px; font-weight:800; line-height:1.2;}
.prg-days button small{display:block; font-size:12px; font-weight:600; color:var(--secondary);}
.prg-days button.on{background:var(--primary); border-color:var(--primary); color:var(--on-primary);}
.prg-days button.on small{color:var(--on-primary); opacity:.8;}
.prg-help{font-size:12.5px; line-height:1.45; color:var(--secondary); margin:0 2px 14px;}
.prg-top{display:flex; align-items:flex-start; gap:10px;}
.prg-no{flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--sunk); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:2px;}
.prg-name{flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font-size:15px; font-weight:800; line-height:1.3;}
.prg-name small{display:block; font-size:12px; font-weight:600; color:var(--secondary); text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px;}
.prg-mv{display:flex; gap:4px; flex-shrink:0;}
.prg-mv button{width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--secondary);}
.prg-mv button:disabled{opacity:.35; cursor:default;}
.prg-mv svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.prg-last{margin:8px 0 10px 34px; font-size:12.5px; color:var(--secondary); font-variant-numeric:tabular-nums;}
.prg-f{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
.prg-f label{display:block;}
.prg-f label span{display:block; font-size:12px; font-weight:700; color:var(--secondary); margin-bottom:3px;}
.prg-f input, .prg-f select{width:100%; height:42px; border-radius:var(--r-sm); border:1.5px solid transparent; background:var(--sunk);
  padding:0 10px; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; outline:none;}
.prg-f input:focus, .prg-f select:focus{border-color:var(--primary); background:var(--surface);}
.prg-add{width:100%; margin:2px 0 14px; border-style:dashed;}
.prg-save{position:sticky; bottom:12px; display:flex; align-items:center; gap:8px; padding:10px; border-radius:var(--r-md);
  background:var(--bar-bg); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--border);}
.prg-save #pgMsg{flex:1; min-width:0; font-size:12.5px; font-weight:600; color:var(--secondary);}
.prg-grp{margin:14px 2px 6px; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--secondary);}
.prg-grp:first-child{margin-top:0;}
@media (min-width:400px){ .prg-f{grid-template-columns:repeat(4,minmax(0,1fr));} }

/* ═══ CARDS & LABELS ═══ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);}
.lbl-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:4px 10px; margin-bottom:12px; min-height:24px;}
.lbl-row > .hint{margin-left:auto; text-align:right;}
.lbl{font-size:15px; font-weight:800; letter-spacing:-.01em; color:var(--primary);}
.hint{font-size:12.5px; font-weight:600; color:var(--secondary);}
.link{position:relative; background:none; border:none; padding:2px 0; font-size:12px; font-weight:800; color:var(--primary); text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px;}
.link:hover{text-decoration:underline;}
.link::after, .r-act::after, .why-b::after, .tg button::after{content:''; position:absolute; inset:-12px -6px;}
.r-act{position:relative;}
.section{margin-top:28px;}
/* Панель картки вправи: білий блок на темнішому фоні */
.panel{background:var(--surface); border-radius:var(--r-lg); padding:18px 16px; margin-bottom:12px; box-shadow:var(--shadow);}
.panel > :last-child{margin-bottom:0;}
.panel .ex-head{margin-bottom:0;}
.panel .card{background:none; border:none; border-radius:0;}
.panel .tech:last-child, .panel .mus:last-child{margin-bottom:0;}
.panel .next{background:var(--sunk);}
.panel .next.up{background:var(--green-tint);}
/* поля всередині панелі — заливкою, без рамки */
.panel .w-field input, .panel .set input, .panel .w-step, .panel #notes, .panel .bd-note-t{background:var(--sunk); border-color:transparent;}
.panel .w-field input:focus, .panel .set input:focus, .panel #notes:focus, .panel .bd-note-t:focus{background:var(--surface); border-color:var(--primary);}
.panel .set.filled input{border-color:var(--green); background:var(--green); color:var(--on-accent);}
.panel .set.low input{border-color:var(--amber-edge); background:var(--amber-tint); color:var(--primary);}
.panel .w-field.need input{border-color:var(--amber-edge); background:var(--amber-tint);}
.panel .warm{background:var(--sunk);}
.panel .wu{background:var(--surface);}
.section > .lbl{display:block; margin-bottom:14px;}

/* ═══ RAIL (навігація між вправами) ═══ */
/* Прогрес тренування: одна смужка з сегментів (сегмент = вправа), торкання — перейти до вправи */
.prog{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.prog-l{flex:1; min-width:0;}
.prog-l .hint{margin-bottom:9px;}
.prog-l .hint b{color:var(--primary);}
.segs{display:flex; gap:4px;}
.seg{flex:1; height:22px; padding:0; border:none; background:none; display:flex; align-items:center; cursor:pointer;}
.seg i{display:block; width:100%; height:5px; border-radius:3px; background:var(--border); transition:background .25s ease, height .2s ease;}
.seg.is-done i{background:var(--green);}
.seg.cur i{height:8px; background:var(--primary);}
.seg.cur.is-done i{background:var(--green-dark);}
/* міні-силует: м'язи темнішають з кожним вписаним підходом цього тренування */
.mini-body{flex-shrink:0; display:flex; align-items:center; gap:6px; height:76px; padding:4px 8px; border:none; border-radius:14px; background:var(--surface); box-shadow:var(--shadow);}
.mini-body:empty{display:none;}
.mini-body .fig{height:64px; width:auto; max-width:none; margin:0;}
.mini-body .fig .m{cursor:inherit;}
.fig .m.bump{animation:mBump .8s ease-out;}
@keyframes mBump{0%{opacity:.25;} 100%{opacity:1;}}

/* ═══ BANNER ═══ */
.banner{display:flex; align-items:center; gap:11px; border-radius:var(--r-md); padding:12px 14px; margin-bottom:22px;
  background:var(--amber-tint); border:1px solid var(--amber-line);}
.banner.info{background:var(--surface); border-color:var(--border);}
.banner-ico{width:28px; height:28px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--amber-ico);}
.banner.info .banner-ico{background:var(--sunk);}
.banner-ico svg{width:15px; height:15px; fill:none; stroke:var(--amber); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.banner.info .banner-ico svg{stroke:var(--secondary);}
.banner-t{flex:1; min-width:0; font-size:12.5px; font-weight:650; line-height:1.35;}
.banner-t small{display:block; font-size:12.5px; font-weight:500; color:var(--secondary);}
.banner button{flex-shrink:0;}

/* ═══ EXERCISE CARD ═══ */
.ex{animation:inRight .26s cubic-bezier(.22,1,.36,1) both;}
.ex.back{animation:inLeft .26s cubic-bezier(.22,1,.36,1) both;}
.ex.out-l{animation:outLeft .13s ease-in both;}
.ex.out-r{animation:outRight .13s ease-in both;}
@keyframes inRight{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;}}
@keyframes inLeft{from{opacity:0; transform:translateX(-20px);} to{opacity:1; transform:none;}}
@keyframes outLeft{to{opacity:0; transform:translateX(-14px);}}
@keyframes outRight{to{opacity:0; transform:translateX(14px);}}

.ex-head{display:block; margin-bottom:32px;}
.ex-acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
.act{display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 13px 0 11px; border:none; border-radius:19px; background:var(--sunk);
  font-size:12.5px; font-weight:800; color:var(--primary); transition:background .15s ease, transform .1s ease;}
.act:active{transform:scale(.97);} .act:hover{background:var(--well);}
.act svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; color:var(--secondary);}
.top-r{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.top-r .icon-btn{width:38px; height:38px; border-radius:19px; margin-top:2px;}
#infoSec .tech, #infoSec .mus{scroll-margin-top:12px;}
#infoSec{scroll-margin-top:12px;}
.ex-titles{flex:1; min-width:0;}
.ex-name{font-family:var(--display); font-size:21px; font-weight:700; letter-spacing:-.02em; line-height:1.2; margin-bottom:14px; text-wrap:balance;}
.chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800; border-radius:20px; padding:5px 10px;
  font-variant-numeric:tabular-nums; background:var(--sunk); color:var(--secondary);}
.chip.tgt{background:var(--primary); color:var(--on-primary);}
.goal{flex-basis:100%; display:flex; align-items:baseline; gap:8px; margin-bottom:4px; font-family:var(--display); font-size:22px; font-weight:700;
  letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums; color:var(--green-dark);}
.goal-k{font-family:Manrope,system-ui,sans-serif; font-size:13px; font-weight:800; letter-spacing:0; color:var(--secondary);}
.chip.man{background:var(--sunk); color:var(--primary); box-shadow:inset 0 0 0 1px var(--border);}
.chip.dl{background:var(--accent-tint); color:var(--accent);}
.icon-btn{flex-shrink:0; width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; color:var(--secondary); transition:border-color .15s ease, color .15s ease;}
.icon-btn:hover{border-color:var(--faint); color:var(--primary);}
.icon-btn svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

/* ── technique ── */
.tech{margin-bottom:0; overflow:hidden;}
.panel .tech + .mus{border-top:1px solid var(--border);}
.tech-row{display:flex; align-items:center; gap:12px; width:100%; padding:10px 0; background:none; border:none; text-align:left;}
.tech-thumb{position:relative; width:72px; height:54px; border-radius:10px; overflow:hidden; background:var(--sunk); flex-shrink:0;}
.tech-thumb img, .tech-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1s ease;}
.tech-media img{object-fit:contain;}
.tech-thumb img.on, .tech-media img.on{opacity:1;}
.tech-txt{flex:1; min-width:0;}
.tech-t{display:block; font-size:13px; font-weight:800;}
.tech-s{display:block; font-size:12px; font-weight:500; color:var(--secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chev{width:16px; height:16px; flex-shrink:0; fill:none; stroke:var(--faint); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s ease;}
.tech.open .chev{transform:rotate(180deg);}
.tech-body{border-top:1px solid var(--border);}
.tech-media{position:relative; aspect-ratio:16/10; background:var(--sunk); cursor:pointer;}
.tech-tag{position:absolute; left:10px; bottom:10px; z-index:2; font-size:12px; font-weight:800;
  background:rgba(22,24,23,.72); color:#fff; border-radius:10px; padding:3px 9px; pointer-events:none;}
.tech-pause{position:absolute; right:10px; bottom:10px; z-index:2; width:28px; height:28px; border-radius:50%;
  background:rgba(22,24,23,.72); display:flex; align-items:center; justify-content:center; pointer-events:none;}
.tech-pause svg{width:11px; height:11px; fill:#fff;}
.cues{list-style:none; padding:11px 14px 4px; display:grid; gap:6px;}
.cues li{position:relative; padding-left:16px; font-size:13px; font-weight:500; line-height:1.4;}
.cues li::before{content:''; position:absolute; left:2px; top:7px; width:6px; height:6px; border-radius:50%; background:var(--faint);}
.mist{padding:10px 14px 4px;}
.mist-t{font-size:13px; font-weight:800; color:var(--primary); margin-bottom:6px;}
.mist ul{list-style:none; display:grid; gap:6px;}
.mist li{position:relative; padding-left:16px; font-size:13px; font-weight:500; line-height:1.4;}
.mist li::before{content:''; position:absolute; left:2px; top:8px; width:8px; height:2px; border-radius:1px; background:var(--red);}
/* детальна техніка */
.td{padding:4px 14px 0;}
.td-s{padding:10px 0; border-bottom:1px solid var(--border);}
.td-t{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--secondary); margin-bottom:6px;}
.td-s ul{list-style:none; display:grid; gap:6px;}
.td-s li{position:relative; padding-left:14px; font-size:13.5px; line-height:1.45;}
.td-s li::before{content:''; position:absolute; left:2px; top:.6em; width:5px; height:5px; border-radius:50%; background:var(--faint);}
.td-r li::before{background:var(--green);}
.td-s li small{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-top:1px;}
.td-src{margin:0 14px 10px; font-size:12.5px; color:var(--secondary);}
.td-src summary{padding:8px 0; font-weight:800; cursor:pointer; color:var(--primary);}
.td-src ol{padding-left:18px; display:grid; gap:6px; line-height:1.4;}
.td-src a{color:var(--green-dark); font-weight:700;}
.td-src p{margin-top:8px; font-size:12px; color:var(--muted);}
.tech-src{padding:2px 14px 11px; font-size:12px; font-weight:500; color:var(--muted);}

/* ── muscles in exercise ── */
.mus{margin-bottom:0; overflow:hidden;}
.mus-row{display:flex; align-items:center; gap:12px; width:100%; padding:10px 0; background:none; border:none; text-align:left;}
.mus-thumb{display:flex; gap:2px; align-items:center; justify-content:center; width:72px; height:54px; border-radius:10px; background:var(--sunk); flex-shrink:0; padding:3px 6px;}
.mus-thumb .fig{height:46px; width:auto; max-width:none;}
.mus.open .chev{transform:rotate(180deg);}
.mus-body{border-top:1px solid var(--border); padding:12px 14px 12px;}
.mus-figs{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:320px; margin:0 auto;}
.mus-figs .fig{max-width:146px;}
.mus-list{list-style:none; margin-top:12px; display:grid; gap:7px;}
.mus-list li{display:grid; grid-template-columns:10px minmax(0,1fr) 40px 76px; align-items:center; gap:8px; padding:3px 0;}
.mu-dot{width:10px; height:10px; border-radius:3px;}
.mu-n{font-size:12.5px; font-weight:600; line-height:1.25;}
.mu-l{font-size:12px; font-weight:600; color:var(--secondary); text-align:left; white-space:nowrap; min-width:0;}
.mu-bar{height:6px; border-radius:3px; background:var(--sunk); overflow:hidden;}
.mu-bar i{display:block; height:100%; border-radius:3px;}
.mus-note{font-size:12px; font-weight:400; color:var(--secondary); margin-top:10px; line-height:1.5;}
.legend.sm{margin-top:6px;}

/* ── reason ── */
.reason{display:flex; gap:7px; align-items:flex-start; margin-top:12px;}
.r-ico{width:14px; height:14px; flex-shrink:0; margin-top:2px; fill:none; stroke:var(--muted); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;}
.t-up .r-ico{stroke:var(--green);}
.t-down .r-ico{stroke:var(--down-ico);}
.t-warn .r-ico{stroke:var(--amber);}
.r-main{font-size:12.5px; font-weight:500; line-height:1.45; color:var(--secondary);}
.r-act{display:inline; background:none; border:none; padding:0; font-size:12.5px; font-weight:800; color:var(--primary);
  text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px; white-space:nowrap;}
.r-act:disabled{color:var(--secondary); text-decoration:none; cursor:default;}

/* ── weight ── */
.w-wrap{display:flex; align-items:stretch; gap:8px;}
.w-field{position:relative; flex:1;}
.w-field input{width:100%; height:60px; padding:0 48px 0 18px; border-radius:var(--r-md); font-family:var(--display);
  border:1.5px solid var(--border); background:var(--surface);
  font-size:26px; font-weight:800; letter-spacing:-.025em; font-variant-numeric:tabular-nums;
  outline:none; transition:border-color .18s ease, box-shadow .18s ease;}
.w-field input:focus{border-color:var(--primary); box-shadow:var(--focus);}
.w-field input::placeholder{color:var(--ph); font-weight:600;}
.w-field.need input{border-color:var(--amber-edge); background:var(--amber-tint);}
.w-unit{position:absolute; right:18px; top:50%; transform:translateY(-50%); font-size:13.5px; font-weight:700; color:var(--secondary); pointer-events:none;}
.w-step{width:52px; border:1.5px solid var(--border); background:var(--surface); border-radius:var(--r-md);
  font-size:20px; font-weight:700; color:var(--secondary);
  transition:border-color .15s ease, background .15s ease, color .15s ease, transform .1s ease;}
.w-step:hover{border-color:var(--primary); color:var(--primary);}
.w-step:active{transform:scale(.94);}

/* ── warm-up ── */
.warm{margin-top:12px; border-radius:var(--r-md); background:var(--sunk); overflow:hidden;}
.warm-row{display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; background:none; border:none; text-align:left;}
.warm-row .lbl{flex-shrink:0;}
.warm-sum{flex:1; min-width:0; font-size:12.5px; font-weight:700; color:var(--primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;}
.warm.open .chev{transform:rotate(180deg);}
.warm-list{display:flex; gap:6px; flex-wrap:wrap; padding:0 12px 4px;}
.wu{border:1.5px solid var(--border); background:var(--surface); border-radius:var(--r-sm); padding:6px 10px 5px; text-align:left;}
.wu b{display:block; font-size:14px; font-weight:800; font-variant-numeric:tabular-nums;}
.wu small{display:block; font-size:12px; font-weight:700; color:var(--secondary); font-variant-numeric:tabular-nums;}
.wu.done{border-color:var(--green); background:var(--green-tint);}
.wu.done b{color:var(--green-dark);}
.warm-foot{padding:4px 12px 10px; font-size:12.5px; font-weight:500; color:var(--secondary); font-variant-numeric:tabular-nums;}

/* ── sets ── */
.sets{display:grid; gap:10px;}
.set{position:relative;}
@keyframes tileIn{from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:none;}}
.set-n{position:absolute; top:9px; left:0; right:0; text-align:center; z-index:2;
  font-size:12px; font-weight:700; color:var(--secondary); pointer-events:none;}
.set input{width:100%; height:88px; padding:12px 4px 0; text-align:center; border-radius:var(--r-md); font-family:var(--display);
  border:1.5px solid var(--border); background:var(--surface);
  font-size:29px; font-weight:800; letter-spacing:-.025em; font-variant-numeric:tabular-nums;
  outline:none; transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;}
.sets.c4 input{font-size:25px;}
.set input:focus{border-color:var(--primary); box-shadow:var(--focus);}
.set input::placeholder{color:var(--ph); font-weight:600;}
.set.filled input{border-color:var(--green); background:var(--green); color:var(--on-accent);}
.set.filled .set-n{color:var(--on-accent); opacity:.85;}
.set.low input{border-color:var(--amber-edge); background:var(--amber-tint); color:var(--primary);}
.set.low .set-n{color:var(--amber-tx); opacity:1;}
.set.pop input{animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.045);}100%{transform:scale(1);}}


/* ── records ── */
.prs{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.prs:empty{display:none;}
#nextBox:empty{display:none;}
.panel .stats:has(+ #nextBox:empty){margin-bottom:0;}
#nextBox .next{margin-top:0;}
.pr svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
.pr{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; border-radius:20px; padding:5px 11px;
  background:var(--gold-tint); color:var(--gold); border:1px solid var(--gold-line); animation:pop .35s cubic-bezier(.34,1.56,.64,1);}

/* ── запас повторень по підходах (RIR) ── */
.rir-k{margin:14px 0 8px; font-size:12px; font-weight:600; line-height:1.4; color:var(--secondary);}
.rirs{display:grid; gap:10px;}
.rir{height:46px; border-radius:var(--r-sm); border:1.5px dashed var(--border); background:var(--surface); color:var(--secondary);
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1;
  transition:border-color .15s ease, background .15s ease, transform .1s ease;}
.rir:active{transform:scale(.96);}
.rir b{font-family:var(--display); font-size:16px; font-weight:700;}
.rir small{font-size:12px; font-weight:600;}
.rir.r3{border-style:solid; border-color:var(--green); background:var(--green-tint); color:var(--green-dark);}
.rir.r2{border-style:solid; border-color:var(--primary); background:var(--sunk); color:var(--primary);}
.rir.r1{border-style:solid; border-color:var(--amber-edge); background:var(--amber-tint); color:var(--amber-tx);}
.rir.r0{border-style:solid; border-color:var(--red); background:var(--red-tint); color:var(--red-tx);}
.panel .rir:not([class*=" r"]){background:var(--sunk); border-color:var(--faint);}
.rir-old{margin-top:8px; font-size:12px; font-weight:600; color:var(--secondary);}

/* ── порівняння з минулим разом ── */
.cmp{padding:12px 16px; border-radius:var(--r-md); background:var(--sunk);}
.cmp .n-k{margin-bottom:6px;}
.cmp-r{display:grid; grid-template-columns:minmax(0,1fr) auto auto; column-gap:10px; align-items:baseline; padding:4px 0;
  font-variant-numeric:tabular-nums; border-top:1px solid var(--border);}
.cmp-r:first-of-type{border-top:none;}
.cmp-r span{font-size:13px; font-weight:600; color:var(--secondary);}
.cmp-r b{font-size:14px; font-weight:800;}
.cmp-r i{font-style:normal; font-size:13px; font-weight:800; min-width:64px; text-align:right; color:var(--secondary);}
.cmp-r i.up{color:var(--green-dark);} .cmp-r i.dn{color:var(--down);}
.cmp-r small{grid-column:1 / 4; font-size:12px; font-weight:500; color:var(--muted); margin-top:-2px;}

.note-btn{display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:3px 0;
  font-size:12.5px; font-weight:700; color:var(--secondary);}
.note-btn:hover{color:var(--primary);}
.note-btn svg{width:12px; height:12px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round;}
#notes, .bd-note-t{width:100%; min-height:70px; padding:12px 14px; border-radius:var(--r-md);
  border:1.5px solid var(--border); background:var(--surface); font-size:16px; font-weight:500; line-height:1.5; outline:none; resize:vertical;}
#notes:focus, .bd-note-t:focus{border-color:var(--primary); box-shadow:var(--focus);}
#notes::placeholder, .bd-note-t::placeholder{color:var(--ph);}

/* ── analytics ── */
.stats{display:grid; grid-template-columns:1fr 1fr; margin-bottom:12px; overflow:hidden;}
.stats > div{padding:14px 16px;}
.stats > div + div{border-left:1px solid var(--border);}
.panel .stats{border-top:1px solid var(--border); margin-bottom:0;}
.panel .stats > div{padding:14px 0 12px;} .panel .stats > div + div{padding-left:16px;}
#nextBox .next{margin-top:12px;}
.st-k{font-size:12.5px; font-weight:700; color:var(--secondary);}
.st-v{font-family:var(--display); font-size:18px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.st-v span{font-size:12.5px; font-weight:700; color:var(--secondary); margin-left:3px;}
.next{display:flex; gap:10px; align-items:flex-start; padding:13px 16px; margin-bottom:0; border-radius:var(--r-md); background:var(--sunk);}
.next.up{background:var(--green-tint);} .next.up .n-v{color:var(--green-dark);}
.next.down{background:var(--down-tint);} .next.down .n-v{color:var(--down);}
.n-k{font-size:12.5px; font-weight:700; color:var(--secondary);}
.n-v{font-size:14.5px; font-weight:800; font-variant-numeric:tabular-nums;}
.n-r{font-size:12.5px; font-weight:500; color:var(--secondary); line-height:1.35;}


/* ═══ BOTTOM BAR ═══ */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--bar-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border); padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.bar-in{max-width:520px; margin:0 auto; display:flex; align-items:center; gap:10px;}
.bar button{height:56px; border:none; border-radius:16px; transition:background .16s ease, opacity .16s ease, transform .09s ease;}
.bar button:active:not(:disabled){transform:scale(.982);}
#btnBack{width:56px; flex-shrink:0; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
#btnBack svg{width:17px; height:17px; stroke:var(--primary); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round;}
#btnNext{flex:1; min-width:0; background:var(--primary); color:var(--on-primary); display:flex; align-items:center; gap:10px;
  padding:0 18px; box-shadow:0 2px 10px rgba(22,24,23,.16); text-align:left;}
#btnNext:hover{opacity:.9;}
.nx{display:flex; flex-direction:column; align-items:flex-start; min-width:0; line-height:1.2;}
.nx b{font-size:15px; font-weight:800;}
.nx small{font-size:12px; font-weight:700; opacity:.8; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#btnNext svg{width:15px; height:15px; stroke:currentColor; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; margin-left:auto;}
.bar button:disabled{opacity:.34; cursor:default; box-shadow:none;}
.bar-note{max-width:520px; margin:7px auto 0; font-size:12.5px; font-weight:700; text-align:center; color:var(--red);}
.bar-note:empty{display:none;}

/* ═══ REST TIMER ═══ */
body.resting{padding-bottom:196px;}
.rest{position:fixed; left:0; right:0; bottom:calc(88px + env(safe-area-inset-bottom)); z-index:31; padding:0 16px; pointer-events:none;}
.rest.low{bottom:calc(14px + env(safe-area-inset-bottom));}
.rest-in{pointer-events:auto; max-width:520px; margin:0 auto; position:relative; overflow:hidden;
  display:flex; align-items:center; gap:10px; padding:9px 10px 9px 14px;
  background:var(--surface); color:var(--primary); border:1px solid var(--border); border-radius:16px; box-shadow:0 4px 16px rgba(22,24,23,.08);}
.rest-in .r-prog{position:absolute; left:0; bottom:0; height:3px; background:var(--green); transition:width .25s linear;}
.rest-l{display:flex; flex-direction:column; min-width:0; line-height:1.15; flex:1;}
.rest-l small{font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rest-t{font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; white-space:nowrap;}
.rest-in button{flex-shrink:0; height:36px; min-width:40px; padding:0 8px; border:none; border-radius:11px; background:var(--sunk);
  color:var(--primary); font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;}
.rest-in button:active{background:var(--border);}
.rest-in button svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle;}
.rest.is-up .rest-in{background:var(--green-tint); border-color:var(--green);}
.rest.is-up .rest-t{color:var(--green-dark);}
.rest.is-up .rest-t{animation:restPulse 1s ease-in-out infinite;}
@keyframes restPulse{50%{opacity:.55;}}

/* ═══ WORKOUT DURATION (тиждень) ═══ */
.dur{list-style:none;}
.dur li{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:13px; font-weight:600;}
.dur li:first-child{border-top:none; padding-top:2px;}
.dur li span{color:var(--secondary); font-weight:500;}
.dur li b{font-variant-numeric:tabular-nums;}
.dur li b.none{color:var(--muted); font-weight:700;}

/* ═══ КАЛЕНДАР РЕГУЛЯРНОСТІ ═══ */
.cal-grid{display:grid; grid-auto-flow:column; grid-template-rows:14px repeat(7,auto); gap:3px; max-width:420px;}
.cal-m{font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap; line-height:14px; overflow:visible; min-width:0;}
.cal-d{font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; line-height:1;}
.cal-c{aspect-ratio:1; border-radius:3px; background:var(--sunk); border:none; padding:0; cursor:pointer;}
.cal-c.out{background:none; cursor:default;}
.cal-c.l1{background:var(--cal1);} .cal-c.l2{background:var(--cal2);} .cal-c.l3{background:var(--cal3);} .cal-c.l4{background:var(--cal4);}
.cal-c.dl{background:var(--amber-line);}
.cal-c.miss{background:none; box-shadow:inset 0 0 0 1.5px var(--red); opacity:.75;}
.cal-c.plan{background:none; box-shadow:inset 0 0 0 1.5px var(--border);}
.cal-c.today{outline:2px solid var(--primary); outline-offset:1px;}
.cal-c.sel{outline:2px solid var(--primary); outline-offset:1px;}
.cal-top{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:12px;}
.cal-top div{display:flex; flex-direction:column;}
.cal-top b{font-size:20px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15;}
.cal-top span{font-size:12px; font-weight:500; color:var(--secondary); line-height:1.3;}
.cal-info{min-height:20px; margin-top:10px; font-size:12px; font-weight:500; color:var(--secondary); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;}
.cal-info b{color:var(--primary);}
.cal-leg{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:12px; font-weight:500; color:var(--muted);}
.cal-leg span{display:inline-flex; align-items:center; gap:4px;}
.cal-leg i{width:10px; height:10px; border-radius:2px; display:inline-block;}

/* ═══ WEEK VIEW ═══ */
.wk-card{padding:18px 16px; margin-bottom:12px; border-color:transparent; box-shadow:var(--shadow);}
.wk-h{font-size:16px; font-weight:800; letter-spacing:-.015em;}
.wk-p{font-size:12.5px; font-weight:500; color:var(--secondary); line-height:1.45; margin-top:3px;}
.wk-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center;}
.btn{height:40px; padding:0 15px; border-radius:12px; font-size:13px; font-weight:800; border:1px solid var(--border); background:var(--surface);}
.btn.pri{background:var(--primary); border-color:var(--primary); color:var(--on-primary);}
.btn:disabled{opacity:.45; cursor:default;}
.dl-list{list-style:none; margin-top:10px; display:grid; gap:5px;}
.dl-list li{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; font-weight:600;}
.dl-list li span{color:var(--amber-tx); font-variant-numeric:tabular-nums;}
.wk-card.warnc{background:var(--amber-tint); border-color:var(--amber-line);}
.wk-ok{display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:500; color:var(--secondary); padding:14px 16px; margin-bottom:12px; border-color:transparent; box-shadow:var(--shadow);}
.wk-ok svg{width:16px; height:16px; fill:none; stroke:var(--green); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

.body-wrap{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.body-fig{text-align:center;}
.fig{display:block; width:100%; max-width:150px; height:auto; margin:0 auto; overflow:visible;}
.body-fig .cap{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:2px;}
.fig .m{cursor:pointer; transition:fill .3s ease, opacity .2s ease;}
.fig.sel .m, .fig.sel .x{opacity:.32;}
.fig.sel .m.on{opacity:1;}
.legend{display:flex; align-items:center; gap:8px; justify-content:center; margin-top:8px; font-size:12px; font-weight:500; color:var(--secondary); flex-wrap:wrap;}
.legend i{display:inline-block; width:16px; height:10px; border-radius:3px;}
.legend span{display:inline-flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums;}
.grp{list-style:none; margin-top:12px; display:grid; gap:1px;}
.grp li{display:grid; grid-template-columns:116px 1fr 46px; align-items:center; gap:10px; padding:7px 6px; border-radius:10px; cursor:pointer;}
.grp li.on{background:var(--sunk);}
.grp .g-n{font-size:12.5px; font-weight:600;}
.grp .g-v{font-size:12.5px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums;}
.grp .g-v small{font-weight:500; color:var(--muted);}
.gbar{position:relative; height:10px; border-radius:5px; background:var(--sunk);}
.gbar .pl{position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--plan-bar);}
.gbar .dn{position:absolute; left:0; top:0; bottom:0; border-radius:5px; transition:width .45s cubic-bezier(.22,1,.36,1);}
.gbar .ref{position:absolute; top:-3px; bottom:-3px; border-left:1.5px dashed var(--faint);}
.why-b{position:relative; display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin:-6px 0 -6px 6px; vertical-align:middle; flex-shrink:0;
  border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--secondary);
  font-size:12px; font-weight:800; letter-spacing:0; text-transform:none; line-height:1; padding:0;}
.why-b[aria-expanded="true"]{background:var(--primary); border-color:var(--primary); color:var(--on-primary);}
.why{animation:fadeIn .2s ease both;}
.grp-note{font-size:12px; font-weight:400; color:var(--secondary); margin-top:10px; line-height:1.5;}
.grp-sel{min-height:18px; text-align:center; font-size:12px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums;}
.mus-fn{max-width:360px; margin:10px auto 4px; padding:9px 12px; border-radius:12px; background:var(--sunk); font-size:12.5px; font-weight:500; line-height:1.45; color:var(--secondary); text-align:left;}
.mus-fn b{display:block; color:var(--primary); font-weight:800; margin-bottom:2px;}
.mus-fn .mf-p{display:block; margin-top:8px;} .mus-fn b + .mf-p{margin-top:4px;}
.mus-fn .mf-p i{display:block; font-style:normal; font-weight:800; color:var(--primary); font-size:12px;}
.mus-list li[data-s]{cursor:pointer; border-radius:8px;}
.mus-list li.on .mu-n{color:var(--primary); text-decoration:underline; text-underline-offset:3px;}

.bw-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:10px; padding:10px 12px; border-radius:var(--r-md); background:var(--sunk);}
.bw-row b{font-size:14.5px; font-weight:800; font-variant-numeric:tabular-nums;}
.str{list-style:none; margin-top:6px;}
.str li{display:grid; grid-template-columns:1fr 64px 60px; gap:10px; align-items:center; padding:10px 2px; border-top:1px solid var(--border);}
.str li:first-child{border-top:none;}
.s-n{font-size:12.5px; font-weight:700; line-height:1.3;}
.s-n small{display:block; font-size:12px; font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums;}
.s-v{display:block; font-size:15px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums;}
.s-d{display:block; font-size:12.5px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums;}
.s-d.up{color:var(--green-dark);} .s-d.down{color:var(--amber-tx);} .s-d.flat{color:var(--muted);}
.spark{display:block; width:64px; height:20px;}
.spark path{fill:none; stroke:var(--green); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}

/* ═══ ПРОГРЕС ═══ */
.pg-top{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.pg-top div{display:flex; flex-direction:column; min-width:0;}
.pg-top b{font-size:20px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15;}
.pg-top b.up{color:var(--green-dark);} .pg-top b.down{color:var(--amber-tx);} .pg-top b.na{color:var(--muted);}
.pg-top span{font-size:12px; font-weight:500; color:var(--secondary); line-height:1.3;}
.pg-say{margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:13px; font-weight:500; line-height:1.5;}
.tg{display:inline-flex; gap:2px; padding:3px; border-radius:10px; background:var(--well); flex-shrink:0;}
.tg button{position:relative; height:30px; padding:0 12px; border:none; border-radius:8px; background:none; font-size:12.5px; font-weight:800; color:var(--secondary);}
.tg button.on{background:var(--surface); color:var(--primary); box-shadow:var(--shadow);}
.pg-list{list-style:none;}
.pg-list > li{border-top:1px solid var(--border);}
.pg-list > li:first-child{border-top:none;}
.pg-row{display:grid; grid-template-columns:minmax(0,1fr) 56px auto; gap:10px; align-items:center; width:100%; padding:11px 2px; background:none; border:none; text-align:left;}
.pg-row .s-n small{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pg-row .spark{width:56px;}
.pg-row .s-v, .pg-row .s-d{white-space:nowrap;}
.pg-xp{padding:2px 2px 12px;}
.pg-cap{font-size:12.5px; font-weight:500; color:var(--secondary); margin-top:6px; line-height:1.45;}
.chart{display:block; width:100%; height:auto; overflow:visible;}
.chart text{font-family:'Manrope',system-ui,sans-serif; font-size:12px; font-weight:700; fill:var(--muted); font-variant-numeric:tabular-nums;}
.chart .gd{stroke:var(--border); stroke-width:1;}
.chart .ln{fill:none; stroke:var(--green); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.chart .ar{fill:var(--green); opacity:.09;}
.chart .dt{fill:var(--surface); stroke:var(--green); stroke-width:1.8;}
.chart .dt.last{fill:var(--green);}
.chart .vl{fill:var(--primary); font-size:12px; font-weight:800;}
.chart .bp{fill:var(--sunk);}
.chart .bv{fill:var(--green);}
.chart .bv.dl{fill:var(--amber-line);}
.chart .bv.now{opacity:.5;}
/* розвиток тіла */
.dv-figs{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:320px; margin:0 auto;}
.dv-figs .fig{max-width:146px;}
.dv-say{margin-top:12px; font-size:13px; font-weight:500; line-height:1.5;}
.dv-say b{font-weight:800;}
.dv-basis{font-size:12.5px; font-weight:500; color:var(--muted); margin-top:3px;}
.dv-list{list-style:none; margin-top:12px; border-top:1px solid var(--border);}
.dv-list > li{border-bottom:1px solid var(--border);}
.dv-list > li:last-child{border-bottom:none;}
.dv-row{display:grid; grid-template-columns:10px minmax(0,1fr) 84px 34px; column-gap:10px; row-gap:2px; align-items:center;
  width:100%; padding:10px 2px; background:none; border:none; text-align:left;}
.dv-row .d{width:10px; height:10px; border-radius:3px;}
.dv-row .n{font-size:13px; font-weight:700;}
.dv-row .v{font-size:13px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums;}
.dv-row .st{grid-column:2 / 5; font-size:12.5px; font-weight:500; color:var(--secondary);}
.dv-row .st b{font-weight:800;}
.dv-bar{position:relative; height:8px; border-radius:4px; background:var(--sunk); overflow:hidden;}
.dv-bar .z{position:absolute; top:0; bottom:0; background:var(--green); opacity:.16;}
.dv-bar i{position:absolute; left:0; top:0; bottom:0; border-radius:4px;}
.dv-bar .t{position:absolute; top:0; bottom:0; width:1px; background:var(--border);}
li.on .dv-row .n{text-decoration:underline; text-underline-offset:3px;}
.dv-xp{padding:0 2px 12px 22px; font-size:12px; line-height:1.5; color:var(--secondary);}
.dv-xp ul{list-style:none; display:grid; gap:3px; margin:2px 0 6px;}
.dv-xp li{display:flex; justify-content:space-between; gap:10px;}
.dv-xp li b{color:var(--primary); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
.dv-xp .tip{color:var(--primary); font-weight:600;}
.rc-row{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:11px 2px;}
.rc-row b{font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap;}
.rc-new{font-size:12px; font-weight:800; border-radius:20px; padding:3px 8px; background:var(--gold-tint); color:var(--gold); border:1px solid var(--gold-line);}
.pg-leg{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; font-size:12px; font-weight:500; color:var(--muted);}
.pg-leg span{display:inline-flex; align-items:center; gap:4px;}
.pg-leg i{width:10px; height:10px; border-radius:2px; display:inline-block;}

/* Вузькі телефони (≤ 360 px): дії вправи в один ряд, вага не обрізається */
@media (max-width:360px){
  .ex-acts{flex-wrap:nowrap;} .act{flex:1 1 0; justify-content:center; padding:0 6px; min-width:0;} .act svg{display:none;}
  .w-field input{font-size:22px; padding:0 38px 0 14px;} .w-unit{right:14px;} .w-step{width:44px;}
}

/* ═══ ВІТРИНА СИЛУЕТУ ═══ */
.bv .fig{filter:drop-shadow(0 1px 0 rgba(255,255,255,.35));}
.mini-body .bv{display:flex; align-items:center; gap:4px;}
.mini-body.bump .bv{animation:miniBump .7s cubic-bezier(.34,1.56,.64,1);}
@keyframes miniBump{40%{transform:scale(1.08);} 100%{transform:none;}}
.mus-thumb .bv{display:flex; align-items:center; gap:2px;}
.done-body .bv{display:flex; justify-content:center; align-items:center; gap:18px; height:100%;}
.fig .m:hover{filter:brightness(1.04);}
.fig .m.on{filter:saturate(1.15);}

/* ═══ SHEET ═══ */
.sheet{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.sheet-bg{position:absolute; inset:0; background:var(--scrim);}
.sheet-card{position:relative; width:100%; max-width:520px; max-height:84vh; overflow:auto; background:var(--bg);
  border-radius:22px 22px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); animation:sheetUp .26s cubic-bezier(.22,1,.36,1) both;}
@keyframes sheetUp{from{transform:translateY(40px); opacity:0;} to{transform:none; opacity:1;}}
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}
.sheet-head b{font-size:17px; font-weight:800; letter-spacing:-.02em;}
.sheet-x{width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--secondary); display:flex; align-items:center; justify-content:center;}
.sheet-x svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round;}
.sheet-sub{font-size:12.5px; font-weight:500; color:var(--secondary); margin-bottom:12px;}
.alt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:8px; margin-bottom:8px; transition:border-color .15s ease;}
.alt:hover{border-color:var(--faint);}
.alt img, .alt .alt-ph{width:64px; height:48px; border-radius:9px; object-fit:cover; background:var(--sunk); flex-shrink:0;}
.alt-n{display:block; font-size:14px; font-weight:800; line-height:1.25;}
.alt-m{display:block; font-size:12.5px; font-weight:500; color:var(--secondary); margin-top:2px;}
.alt.cur{opacity:.45; cursor:default;}
.h-top{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:12px 14px; margin-bottom:10px;}
.h-top b{display:block; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
.h-top span{display:block; font-size:12px; font-weight:600; color:var(--secondary);}
.h-top .spark{width:84px; height:26px;}
.hrow{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:10px 2px; border-top:1px solid var(--border);}
.hrow:first-child{border-top:none;}
.hrow > span{font-size:12.5px; font-weight:600; color:var(--secondary); white-space:nowrap;}
.hrow > div{text-align:right; min-width:0;}
.hrow b{font-size:14px; font-weight:800; font-variant-numeric:tabular-nums;}
.hrow small{display:block; font-size:12px; font-weight:600; color:var(--muted);}
.h-empty{padding:18px 4px; font-size:13px; color:var(--secondary);}

/* ═══ DONE ═══ */
.done{text-align:center; padding:26px 0 20px; animation:prgUp .5s ease-out both;}
.done-badge{position:relative; width:80px; height:80px; margin:0 auto 18px;}
.done-badge svg{position:absolute; inset:0; width:80px; height:80px;}
.dn-ring{fill:none; stroke:var(--green); stroke-width:3; stroke-dasharray:264; stroke-dashoffset:264;
  animation:draw264 .8s cubic-bezier(.22,1,.36,1) .1s forwards; transform:rotate(-90deg); transform-origin:center;}
@keyframes draw264{to{stroke-dashoffset:0;}}
.dn-fill{fill:var(--green-tint); opacity:0; animation:fadeIn .5s .5s ease forwards;}
@keyframes fadeIn{to{opacity:1;}}
.dn-check{fill:none; stroke:var(--green); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:36; stroke-dashoffset:36; animation:draw36 .4s .7s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes draw36{to{stroke-dashoffset:0;}}
.done h2{font-family:var(--display); font-size:28px; font-weight:800; letter-spacing:-.02em;}
.done > p{margin-top:5px; font-size:13.5px; color:var(--secondary);}
.sum{display:grid; grid-template-columns:repeat(4,auto); justify-content:center; gap:0; margin:22px 0 18px;}
.sum div{padding:2px 14px;}
.sum div + div{border-left:1px solid var(--border);}
.sum b{display:block; font-family:var(--display); font-size:18px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.sum span{display:block; margin-top:2px; font-size:12px; font-weight:600; color:var(--secondary);}
.done-cmp{max-width:420px; margin:16px auto 0; text-align:left;}
.done-cmp:empty{display:none;}
.dc-r{display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:12px; padding:8px 0; border-top:1px solid var(--border); font-variant-numeric:tabular-nums;}
.dc-n{font-size:13px; font-weight:700;}
.dc-r > b{font-size:13.5px; font-weight:800; text-align:right;}
.dc-d{grid-column:1 / 3; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin-top:2px;}
.dc-d i{font-style:normal; font-size:12.5px; font-weight:800; color:var(--secondary);}
.dc-d i.up, .dc-tot .up{color:var(--green-dark);} .dc-d i.dn, .dc-tot .dn{color:var(--down);}
.dc-d small{font-size:12px; font-weight:500; color:var(--muted);}
.dc-tot{padding-top:8px; border-top:1px solid var(--border); font-size:12.5px; color:var(--secondary);}
.dc-tot b{color:var(--primary);}
.done-prs{display:grid; gap:6px; justify-items:start; text-align:left; margin-top:4px;}
.done-body{display:flex; justify-content:center; align-items:center; gap:18px; height:240px; margin:0 0 22px;
  padding:8px 0;}
.done-body .fig{height:190px; width:auto; max-width:none; margin:0;}
.done-body .fig .m{cursor:default;}
.done-body.play .fig{animation:figRise .55s cubic-bezier(.22,1,.36,1) both;}
.done-body.play .fig + .fig{animation-delay:.07s;}
@keyframes figRise{from{opacity:0; transform:translateY(8px) scale(.97);}}
@keyframes tonIn{from{opacity:0; transform:translateY(4px);}}
.done-acts{display:flex; gap:10px; justify-content:center; margin-top:28px; flex-wrap:wrap;}

/* ═══ SKELETON / EMPTY ═══ */
.sk div{border-radius:13px; background:linear-gradient(100deg,var(--sk1) 30%,var(--sk2) 50%,var(--sk1) 70%); background-size:220% 100%; animation:shine 1.4s linear infinite;}
@keyframes shine{to{background-position:-220% 0;}}
.sk .a{height:40px; margin-bottom:18px;} .sk .b{height:26px; width:72%; margin-bottom:12px;}
.sk .c{height:66px; margin-bottom:20px;} .sk .d{height:88px; display:inline-block; width:31.5%; margin-right:2.2%;}
.sk .d:last-child{margin-right:0;}
.empty{padding:46px 0 20px; text-align:center;}
.empty h2{font-size:18px; font-weight:800; letter-spacing:-.02em;}
.empty p{margin-top:6px; font-size:13.5px; color:var(--secondary); word-break:break-word;}
.diag{margin-top:22px; overflow:hidden; text-align:left;}
.diag summary{padding:13px 16px; font-size:12px; font-weight:700; color:var(--secondary); cursor:pointer; list-style:none;}
.diag summary::-webkit-details-marker{display:none;}
.diag pre{padding:0 16px 16px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
  line-height:1.6; white-space:pre-wrap; word-break:break-word; color:var(--secondary); max-height:48vh; overflow:auto;}

/* Темна тема — компоненти з власними кольорами (після базових правил) */
[data-theme="dark"] .rest-in{background:#202421; box-shadow:0 4px 16px rgba(0,0,0,.4);}
[data-theme="dark"] .rest-in button{background:#2E332F;} [data-theme="dark"] .rest-in button:active{background:#3A403B;}

/* ═════════════════════════════════════════════════════════════════════
   СТИЛЬ «НАЛІПКА» (концепт B, під маскота-кота)
   Тільки оформлення: токени + рамки/тіні компонентів. Логіку не чіпає.
   Контур 2px кольору лінії маскота (#2A2438), жорстка тінь 3px, лаймовий акцент майки.
   Щоб повернути старий вигляд — видали цей блок до рядка «КІНЕЦЬ СТИЛЮ НАЛІПКА».
   ═════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#EEE9F6; --surface:#FFFFFF; --sunk:#F6F3FB; --well:#E4DDF0;
  --primary:#2A2438; --secondary:#5D5670; --muted:#625B76; --faint:#A79FB8; --border:#DCD4E8;
  --green:#7ED35A; --green-dark:#24702F; --green-tint:#DDF3CF;
  --on-primary:#FFFFFF; --on-accent:#2A2438; --ph:#8A8299; --bar-bg:rgba(238,233,246,.94); --plan-bar:#E4DDF0;
  --sk1:#E4DDF0; --sk2:#F1EDF8; --scrim:rgba(42,36,56,.45);
  --cal1:#D6F0C4; --cal2:#A3DB7E; --cal3:#6CC24A; --cal4:#3A8A2C;
  --heat0:#E6E0EF;
  --lvl1:#3A8A2C; --lvl2:#6CC24A; --lvl3:#A3DB7E; --peak:#9BEA6F;
  --gold:#8A4300; --gold-tint:#FFE3C2; --gold-line:#2A2438;
  --fig-skin:#F3F0F8; --fig-hair:#D3CCDF; --fig-muscle:#E6E0EF; --fig-body:#C2B9D1; --fig-line:#BDB4CC; --fig-sel:#ADA4BE;
  --fig-hi:#FFFFFF; --fig-lo:#5D5670; --fig-shadow:rgba(42,36,56,.2);
  --shadow:none; --focus:0 0 0 3px rgba(126,211,90,.45);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ink-line:#2A2438; --hard:3px 3px 0 #2A2438; --hard-sm:2px 2px 0 #2A2438;
}
:root[data-theme="dark"]{
  --bg:#17131F; --surface:#241E30; --sunk:#2C2539; --well:#1F1A29;
  --primary:#F2EEF8; --secondary:#C6BFD4; --muted:#A79FB8; --faint:#5D5670; --border:#3A3347;
  --green:#7ED35A; --green-dark:#9BE07C; --green-tint:#24351C;
  --on-primary:#17131F; --on-accent:#17131F; --ph:#8C8499; --bar-bg:rgba(23,19,31,.92); --plan-bar:#3A3347;
  --sk1:#221C2C; --sk2:#2C2539; --scrim:rgba(0,0,0,.6);
  --cal1:#2D4826; --cal2:#3E7A2F; --cal3:#64B046; --cal4:#AEE592;
  --heat0:#3A3347;
  --lvl1:#AEE592; --lvl2:#64B046; --lvl3:#2D4826; --peak:#D6FBC4;
  --gold:#F6B97E; --gold-tint:#3A2818; --gold-line:#D9D0EA;
  --fig-skin:#342D40; --fig-hair:#4A4259; --fig-muscle:#3E3649; --fig-body:#221C2C; --fig-line:#1B1724; --fig-sel:#6A6179;
  --fig-hi:#A79FB8; --fig-lo:#000000; --fig-shadow:rgba(0,0,0,.45);
  --focus:0 0 0 3px rgba(126,211,90,.35);
  --ink-line:#D9D0EA; --hard:3px 3px 0 #000000; --hard-sm:2px 2px 0 #000000;
}
/* профіль Ліни: рожевий замість лаймового */
:root[data-accent="pink"]{
  --green:#F08DB6; --green-dark:#AE3A6B; --green-tint:#FBE4EE;
  --cal1:#F7D3E2; --cal2:#EFA3C2; --cal3:#DB6C99; --cal4:#A83467;
  --lvl1:#A83467; --lvl2:#DB6C99; --lvl3:#EFA3C2; --peak:#F27BAA;
  --focus:0 0 0 3px rgba(240,141,182,.45);
}
:root[data-accent="pink"][data-theme="dark"]{
  --green:#E879A6; --green-dark:#F4A3C4; --green-tint:#3A1E2C;
  --cal1:#4A2536; --cal2:#7A3556; --cal3:#B85082; --cal4:#F0A6C6;
  --lvl1:#F0A6C6; --lvl2:#B85082; --lvl3:#4A2536; --peak:#FFE0EE;
  --focus:0 0 0 3px rgba(232,121,166,.35);
}

/* контур і жорстка тінь — «наліпки» */
.card, .panel, .wk-card, .wk-ok, .mini-body, .switch, .icon-btn, .btn, .alt, .h-top, .sheet-x, .banner, .prg-save{border:2px solid var(--ink-line);}
.card, .panel, .wk-card, .wk-ok, .mini-body, .btn, .alt, .h-top{box-shadow:var(--hard);}
.switch, .icon-btn, .sheet-x{box-shadow:var(--hard-sm);}
.panel .card{border:none; box-shadow:none;}
.wk-card, .wk-ok{border-color:var(--ink-line);}
.wk-card.warnc{border-color:var(--ink-line);}
.banner.info{border-color:var(--ink-line);}
.banner-ico{border:2px solid var(--ink-line); background:var(--surface);}
.btn{height:44px; border-radius:14px;}
.btn.pri{background:var(--green); border-color:var(--ink-line); color:var(--on-accent);}
.btn:active:not(:disabled){transform:translate(2px,2px); box-shadow:var(--hard-sm);}
.prg-add{border-style:dashed; box-shadow:none;}

/* шапка */
.top h1{font-weight:800;}
.day-st, .sync.ok, .sync.run{border:2px solid var(--ink-line);}

/* вкладки: окремі наліпки, активна — лайм */
.tabs{background:none; padding:0; gap:6px;}
.tabs button{height:40px; padding:0 2px; border:2px solid var(--ink-line); border-radius:14px; background:var(--surface); color:var(--secondary); font-size:clamp(11px,3.2vw,12px); letter-spacing:-.01em;}
.tabs button.on{background:var(--green); color:var(--on-accent); box-shadow:var(--hard-sm);}
.tabs .dot{border:1.5px solid var(--ink-line); width:8px; height:8px; background:#F6A04D;}

/* рейка вправ */
.seg i{height:8px; border:1.5px solid var(--ink-line); background:var(--surface);}
.seg.is-done i{background:var(--green);}
.seg.cur i{height:12px; background:var(--primary);}

/* картка вправи */
.ex-acts{border-top:2px dashed var(--border);}
.act{border:2px solid var(--ink-line); background:var(--surface);}
.act svg{color:var(--primary);}
.chip{border:2px solid var(--ink-line); background:var(--surface); color:var(--primary);}
.chip.tgt{background:var(--primary); color:var(--on-primary);}
.panel .w-field input, .panel .set input, .panel .w-step, .panel #notes, .panel .bd-note-t{background:var(--sunk); border:2px solid var(--ink-line);}
.panel .w-field input:focus, .panel .set input:focus, .panel #notes:focus, .panel .bd-note-t:focus{background:var(--surface); border-color:var(--ink-line); box-shadow:var(--focus);}
.w-step{color:var(--primary);}
.w-step:active{transform:translate(2px,2px);}
.panel .set.filled input{background:var(--green); border-color:var(--ink-line); color:var(--on-accent); box-shadow:var(--hard-sm);}
.set.filled .set-n{color:var(--on-accent);}
.panel .set.low input{background:var(--amber-tint); border-color:var(--ink-line);}
.panel .w-field.need input{background:var(--amber-tint); border-color:var(--ink-line);}
.rir{border-width:2px;}
.rir.r3, .rir.r2, .rir.r1, .rir.r0{border-color:var(--ink-line);}
.rir.r2{background:var(--primary); color:var(--on-primary);}
.panel .rir:not([class*=" r"]){border-width:2px;}
.pr, .rc-new{border:2px solid var(--ink-line);}
.cmp{border:2px solid var(--ink-line);}
.panel .next{border:2px solid var(--ink-line);}
.panel .stats{border-top:2px dashed var(--border);}
.tech-thumb, .mus-thumb{border:2px solid var(--ink-line);}
.panel .warm{border:2px solid var(--ink-line);}
.wu{border-width:2px; border-color:var(--ink-line);}

/* нижня панель і таймер */
.bar{border-top:2px solid var(--ink-line);}
.bar button{height:58px;}
#btnBack{border:2px solid var(--ink-line); box-shadow:var(--hard-sm);}
#btnNext{background:var(--green); color:var(--on-accent); border:2px solid var(--ink-line); box-shadow:var(--hard);}
#btnNext:hover{opacity:1;}
.bar button:active:not(:disabled){transform:translate(2px,2px); box-shadow:var(--hard-sm);}
.rest-in, :root[data-theme="dark"] .rest-in{background:var(--surface); border:2px solid var(--ink-line); box-shadow:var(--hard);}
.rest-in button, :root[data-theme="dark"] .rest-in button{background:var(--sunk); border:2px solid var(--ink-line);}
.rest-in .r-prog{height:4px;}
.rest.is-up .rest-in{background:var(--green-tint); border-color:var(--ink-line);}

/* тиждень, прогрес, графіки */
.gbar{height:12px; border:1.5px solid var(--ink-line); border-radius:7px;}
.legend i, .pg-leg i, .cal-leg i, .mu-dot, .dv-row .d{box-shadow:0 0 0 1.5px var(--ink-line);}
.cal-c{border-radius:4px;}
.cal-c.l1, .cal-c.l2, .cal-c.l3, .cal-c.l4, .cal-c.dl{box-shadow:inset 0 0 0 1.5px var(--ink-line);}
.cal-c.miss{box-shadow:inset 0 0 0 1.5px var(--red); opacity:1;}
.tg{border:2px solid var(--ink-line); background:var(--surface);}
.tg button.on{background:var(--primary); color:var(--on-primary);}
.why-b{border:2px solid var(--ink-line);}
.spark path, .chart .ln{stroke:var(--green-dark);}
.chart .ar{fill:var(--green); opacity:.18;}
.chart .dt{stroke:var(--green-dark);}
.chart .dt.last{fill:var(--green-dark);}
.chart .bv{stroke:var(--ink-line); stroke-width:1.5;}
.bw-row, .mus-fn{border:2px solid var(--ink-line);}

/* програма */
.prg-days button{border:2px solid var(--ink-line); box-shadow:var(--hard-sm);}
.prg-days button.on{border-color:var(--ink-line);}
.prg-no{border:2px solid var(--ink-line); background:var(--green); color:var(--on-accent);}
.prg-mv button{border:2px solid var(--ink-line); color:var(--primary);}
.prg-f input, .prg-f select{border:2px solid var(--ink-line);}
.prg-f input:focus, .prg-f select:focus{border-color:var(--ink-line); box-shadow:var(--focus);}

/* шторка */
.sheet-card{border-top:2px solid var(--ink-line);}

/* Готово: маскот-наліпка замість кружечка з галочкою */
.done-hero{position:relative; width:180px; height:170px; margin:0 auto 10px;}
.done-hero::before{content:''; position:absolute; left:50%; top:4px; width:150px; height:150px; transform:translateX(-50%);
  background:#F6A04D; border:2px solid var(--ink-line); border-radius:42% 58% 55% 45% / 50% 45% 55% 50%;}
.done-hero .kit{position:relative; display:block; width:132px; height:154px; margin:0 auto; transform:rotate(-4deg);
  animation:kitIn .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes kitIn{from{opacity:0; transform:rotate(-12deg) scale(.8);}}
.done-hero .done-badge{position:absolute; right:6px; top:2px; width:52px; height:52px; margin:0; border-radius:50%;
  background:var(--surface); border:2px solid var(--ink-line); box-shadow:var(--hard-sm);}
.done-hero .done-badge svg{inset:0; width:48px; height:48px;}
.done-hero .dn-fill{fill:var(--green); opacity:1; animation:none;}
.done-hero .dn-ring{stroke:var(--ink-line);}
.done-hero .dn-check{stroke:var(--on-accent);}
/* коли під заголовком показано силует м'язів — кіт менший, щоб підсумок не з'їжджав за екран */
.done-hero:has(.done-badge.hidden){width:110px; height:100px; margin-bottom:4px;}
.done-hero:has(.done-badge.hidden)::before{width:88px; height:88px; top:4px;}
.done-hero:has(.done-badge.hidden) .kit{width:78px; height:92px;}
.done h2{font-size:32px;}
.sum{grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px;}
.sum div, .sum div + div{padding:10px 2px; border:2px solid var(--ink-line); border-radius:14px; background:var(--surface); box-shadow:var(--hard-sm);}
.done-cmp{padding:12px 14px; border:2px solid var(--ink-line); border-radius:var(--r-lg); background:var(--surface); box-shadow:var(--hard);}
.done-cmp .dc-r:first-of-type{border-top:none;}

/* ціль і рекорди — наліпки-пілюлі, як у концепті */
.goal{flex-basis:auto; display:inline-flex; align-items:baseline; gap:8px; padding:4px 12px 5px; margin-bottom:6px; border:2px solid var(--ink-line); border-radius:14px;
  background:var(--green); color:var(--on-accent); box-shadow:var(--hard-sm); font-size:20px;}
.goal-k{color:var(--on-accent); opacity:.8;}
.chips{gap:8px;}
.pr, .rc-new{background:#F6A04D; color:#2A2438;}
.wk-ok svg{stroke:var(--green-dark);}

/* Програма: більше повітря, діапазон «від–до», дії внизу картки */
.prg-it{padding:16px 16px 14px;}
.prg-list .prg-it + .prg-it{margin-top:14px;}
.prg-name{font-size:15.5px;}
.prg-name small{text-decoration:none; color:var(--muted);}
.prg-last{margin:6px 0 14px 34px;}
.prg-f{grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr) minmax(0,1fr); gap:10px; align-items:end;}
.prg-f label span, .prg-rng > span{display:block; font-size:12px; font-weight:700; color:var(--secondary); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.prg-rng-in{display:flex; align-items:center; gap:4px;}
.prg-rng-in i{font-style:normal; font-weight:800; color:var(--secondary);}
.prg-rng-in input{flex:1; min-width:0; width:100%; height:42px; border-radius:var(--r-sm); border:2px solid var(--ink-line); background:var(--sunk);
  padding:0 6px; text-align:center; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; outline:none;}
.prg-rng-in input:focus{background:var(--surface); box-shadow:var(--focus);}
.prg-f select{padding:0 6px;}
.prg-acts{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:12px; border-top:2px dashed var(--border);}
.prg-swap svg{width:16px; height:16px;}
.prg-mv button{width:38px; height:38px;}
.prg-help{margin-bottom:16px;}
.prg-acts .act{flex:0 0 auto; padding:0 14px 0 12px;}
.prg-acts .act svg{display:inline-block;}
.prg-help .nw{white-space:nowrap;}
/* підказка в плитці підходу — діапазон плану, дрібніше за вписане число */
.set input::placeholder{font-size:20px; font-weight:700; letter-spacing:0;}

/* Порожній стан з маскотом */
.empty .kit{display:block; width:120px; height:140px; margin:0 auto 14px; transform:rotate(-4deg);}
/* ═══ КІНЕЦЬ СТИЛЮ НАЛІПКА ═══ */


/* Карта м'язів кота: сіро-лавандове тіло, м'язи темніші, контур — колір наліпки */
:root{ --cat-body:#DCD7E6; --cat-hi:#FFFFFF; --cat-muzzle:#EEEBF4; --cat-shade:#B9B1C9; --cat-line:#2A2438;
  --fig-muscle:#B9B1C9; --fig-sel:#9C93B0; }
:root[data-theme="dark"]{ --cat-body:#6A6180; --cat-hi:#F2EEF8; --cat-muzzle:#7C7392; --cat-shade:#4B4360; --cat-line:#0E0B13;
  --fig-muscle:#4B4360; --fig-sel:#8F86A6; }
.fig.cat{max-width:150px;}
.bv .fig.cat{filter:none;}

/* Правки 27.10: без рекордів у «Готово» і без кота з м'язами в шапці; кіт у картці вправи — більший */
.mini-body{display:none !important;}   /* кіт з м'язами в шапці прибраний — Віталій 27.10 */
#railMeta{display:none;}   /* підпис «Вправа N з M» прибрано — видно зі шкали */
.done-prs{display:none;}
/* ═══ МАСКОТ: фінальні емоції кота (WebP усередині файлу, щоб не залежати від хостингу) ═══ */
.mc{display:block; background:center / contain no-repeat;
  filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(3px 3px 0 var(--ink-line));}
:root[data-theme="dark"] .mc{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(3px 3px 0 #000);}
.mc-happy{background-image:none;}
.mc-proud{background-image:none;}
.mc-rest{background-image:none;}
.mc-focus{background-image:none;}
.mc-tired{background-image:none;}
.mc-wave{background-image:none;}
.done-hero::before{background:var(--green-tint);}
.done-hero .kit{animation:kitIn .5s cubic-bezier(.34,1.56,.64,1) both; transform:rotate(-3deg);}
.empty .kit{width:120px; height:150px;}
.rest-cat{flex:0 0 auto; width:34px; height:40px; margin:-2px -2px -2px -4px; filter:none;}
.rest-l small{letter-spacing:.03em;}
.ex-cat-w{float:right; position:relative; width:92px; height:112px; margin:-10px -8px 6px 10px; shape-outside:margin-box;}
.ex-head .ex-acts{clear:both;}
.ex-cat-w::before{content:''; position:absolute; left:6px; right:2px; top:18px; bottom:2px; border-radius:46% 54% 50% 50% / 52% 48% 52% 48%;
  background:var(--green-tint); border:2px solid var(--ink-line); box-shadow:var(--hard-sm); transform:rotate(-6deg);}
.ex-cat-w .ex-cat{position:relative; width:100%; height:100%; transform:rotate(5deg); animation:kitIn .45s cubic-bezier(.34,1.56,.64,1) both;}
.wk-cat{float:right; width:62px; height:80px; margin:-8px -6px 6px 10px; transform:rotate(4deg);}
@media (max-width:370px){ .ex-cat-w{width:78px; height:96px;} }

/* ── ВІДСТУПИ ЗА БЛИЗЬКІСТЮ: шкала 4·8·12·16·24·32·40.
   Пов'язане стоїть щільно (підпис і поле, смужка і картка), окремі смислові блоки розведені далі. ── */
.top{margin-bottom:16px;}
.tabs{margin-bottom:24px;}
.prog{margin-bottom:12px;}
.lbl-row{margin-bottom:8px;}
.ex-name{margin-bottom:12px;}
.ex-acts{margin-top:16px; padding-top:16px;}
.ex > .panel{margin-bottom:16px;}
.ex > .panel:has(#sets){margin-bottom:8px;}
.ex > #infoSec{margin-top:40px;}
.rir-k{margin:16px 0 8px;}
.section{margin-top:40px;}
.section:first-child{margin-top:0;}
.mu-n{min-width:0; overflow-wrap:anywhere; hyphens:auto;}
.grp{margin-top:24px;}
.prg-days{margin-bottom:8px;}
.prg-help{margin-bottom:24px;}
.prg-list .prg-it + .prg-it{margin-top:16px;}
.prg-add{margin:16px 0 24px;}

/* ── вибір тижня ── */
.wk-nav{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.wk-nav-t{flex:1; min-width:0; text-align:center; line-height:1.2; background:none; border:none; padding:4px 0; border-radius:12px;}
.wk-nav-t b svg{width:15px; height:15px; vertical-align:-2px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
.wk-opts{display:grid; gap:8px;}
.wk-opt{display:grid; grid-template-columns:auto 1fr auto; align-items:baseline; gap:10px; text-align:left; padding:12px 14px; border:2px solid var(--ink-line); border-radius:14px; background:var(--surface); color:var(--primary);}
.wk-opt b{font-size:14.5px; font-weight:800;} .wk-opt span{font-size:12.5px; font-weight:600; color:var(--secondary); min-width:0;} .wk-opt i{font-style:normal; font-size:12.5px; font-weight:800; color:var(--secondary); font-variant-numeric:tabular-nums;}
.wk-opt.on{background:var(--green); color:var(--on-accent); box-shadow:var(--hard-sm);} .wk-opt.on span, .wk-opt.on i{color:var(--on-accent);}
.wk-nav-t b{display:block; font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:-.01em;}
.wk-nav-t small{display:block; margin-top:2px; font-size:12px; font-weight:600; color:var(--secondary);}
.wk-nav .icon-btn{border-radius:20px; color:var(--primary);}
.wk-nav .icon-btn:disabled{opacity:.35; box-shadow:none; cursor:default;}
#weekView.wk-busy{pointer-events:none;}
#weekView.wk-busy > :not(.wk-sk){display:none;}
#exWrap.sk-on{display:none;}
#programView .sk-in{animation:none; opacity:1;}   /* «Програми»: скелетон з'являється одразу, без проявлення */

/* ── вибір дня (замість системного списку) ── */
.switch{cursor:pointer; color:var(--primary);}
.dp-w{margin-top:20px;}
.dp-w:first-child{margin-top:4px;}
.dp-h{display:flex; align-items:baseline; gap:8px; margin:0 2px 8px;}
.dp-h b{font-family:var(--display); font-size:15px; font-weight:700; letter-spacing:-.01em;}
.dp-h span{font-size:12.5px; font-weight:600; color:var(--secondary);}
.dp-h em{margin-left:auto; font-style:normal; font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:10px; background:var(--green-tint); border:1.5px solid var(--ink-line);}
.dp-days{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
.dp-d{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:10px 12px; border-radius:14px; text-align:left;
  background:var(--surface); border:2px solid var(--ink-line); box-shadow:var(--hard-sm); color:var(--primary);}
.dp-d b{font-size:15px; font-weight:800; line-height:1.2;}
.dp-d span{font-size:12px; font-weight:600; color:var(--secondary); white-space:nowrap;}
.dp-d svg{position:absolute; top:9px; right:9px; width:15px; height:15px; fill:none; stroke:var(--green-dark, var(--green)); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
.dp-d.done{background:var(--green-tint);}
.dp-d.today b::after{content:'сьогодні'; display:block; font-size:10.5px; font-weight:800; letter-spacing:.02em; color:var(--secondary); text-transform:uppercase;}
.dp-d.on{background:var(--green); box-shadow:var(--hard);}
.dp-d.on span{color:var(--primary);}
.dp-d.on svg{stroke:var(--primary);}
.dp-d:active{transform:translate(2px,2px); box-shadow:none;}
.sheet-head{position:sticky; top:-16px; z-index:2; background:var(--bg); margin:-16px -16px 4px; padding:16px 16px 8px;}
.prg-gap{height:14px;}
.prg-days{margin-bottom:24px;}
.grp-hd{display:flex; justify-content:space-between; gap:10px; margin:24px 6px 4px; font-size:12px; font-weight:700; color:var(--secondary);}
.grp-hd + .grp{margin-top:0;}

/* рівні тижневої карти: «мало» в темній темі світліше, бо найтемніший відтінок губиться на коті */
:root{--wk1:var(--cal2);}
:root[data-accent="pink"][data-theme="dark"]{--wk1:#9E4471;}
@media (max-width:380px){ .wk-leg{gap:6px; font-size:11.5px;} .wk-leg i{width:14px;} }
@media (max-width:340px){ .wk-leg{display:grid; grid-template-columns:auto auto; justify-content:center; gap:4px 12px;} }

/* ── прибрано з показу на прохання Віталія (28.10): % виконання плану, рекорди, позначка «збережено» ── */
.stats{grid-template-columns:1fr;}
.sum{grid-template-columns:repeat(3,minmax(0,1fr));}
.prs, .done-prs, .pr, #sync{display:none !important;}
/* ── кіт-наліпка підстрибує від дотику ── */
.mc{cursor:pointer; -webkit-tap-highlight-color:transparent;}
.ex-cat{--rot:5deg;} .done-hero .kit{--rot:-3deg;} .empty .kit{--rot:-4deg;} .wk-cat{--rot:4deg;}
.mc.hop{animation:catHop .85s linear both, catShadow .85s linear both !important; transform-origin:50% 92%; will-change:transform;}
/* жорстка тінь-наліпка під час стрибка зникає (інакше вона крутиться/розтягується разом із котом і вуса дають «штриховку»), на приземленні повертається */
@keyframes catShadow{
  8%,90%{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 0 0 transparent);}
}
/* стрибок кота: присів → ривок угору з витягуванням → зависання → падіння → приземлення з сплющенням → дві дрібні пружинки.
   Кожен відрізок має свою криву (вгору — ease-out, вниз — ease-in), нахил щоразу в інший бік (--t задає JS). */
@keyframes catHop{
  0%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1,1); animation-timing-function:ease-out;}
  12%{transform:translateY(2%) rotate(var(--rot,0deg)) scale(1.12,.84); animation-timing-function:cubic-bezier(.2,.8,.3,1);}
  30%{transform:translateY(-30%) rotate(calc(var(--rot,0deg) + var(--t,5deg))) scale(.92,1.12); animation-timing-function:ease-out;}
  46%{transform:translateY(-36%) rotate(calc(var(--rot,0deg) + var(--t,5deg) * .4)) scale(.98,1.03); animation-timing-function:ease-in;}
  66%{transform:translateY(0) rotate(calc(var(--rot,0deg) - var(--t,5deg) * .3)) scale(1.15,.82); animation-timing-function:ease-out;}
  78%{transform:translateY(-9%) rotate(var(--rot,0deg)) scale(.97,1.04); animation-timing-function:ease-in;}
  88%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1.05,.95); animation-timing-function:ease-out;}
  94%{transform:translateY(-2%) rotate(var(--rot,0deg)) scale(.99,1.01); animation-timing-function:ease-in;}
  100%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1,1);}
}

/* ── АНІМАЦІЇ «НАЛІПКА» (28.10, Віталій обрав 1, 2, 3, 5, 6) ── */
/* 1. один натиск для всіх кнопок-наліпок: притиснули — тінь зникла */
.act, .rir, .w-step, .icon-btn, .switch, .sheet-x, .tabs button, .prg-days button, .prg-mv button, .alt, .rest-in button, .dp-d, #btnBack{transition:transform .06s ease, box-shadow .06s ease, background .15s ease, color .15s ease, border-color .15s ease, opacity .16s ease;}
.act:active, .rir:active, .w-step:active, .icon-btn:active:not(:disabled), .switch:active, .sheet-x:active, .tabs button:active,
.prg-days button:active, .prg-mv button:active:not(:disabled), .alt:active:not(:disabled), .rest-in button:active, #btnBack:active:not(:disabled){transform:translate(2px,2px); box-shadow:none;}
/* 2. нова вправа «приліплюється» збоку з легким поворотом і пружинкою */
/* при запуску й перемиканні вкладок картка вправи підстрибує; при гортанні вправ — як раніше «приліплюється» збоку */
.ex:not(.sw){animation:none;}
.ex:not(.sw) > .panel{animation:prgUp .5s ease-out both;}
.ex:not(.sw) > .panel:nth-child(2){animation-delay:.05s;} .ex:not(.sw) > .panel:nth-child(3){animation-delay:.1s;}
.ex:not(.sw) > .panel:nth-child(4){animation-delay:.15s;} .ex:not(.sw) > .panel:nth-child(5){animation-delay:.2s;} .ex:not(.sw) > .panel:nth-child(n+6){animation-delay:.25s;}
.ex.sw{animation:stickR .34s cubic-bezier(.34,1.56,.64,1) both;}
.ex.sw.back{animation:stickL .34s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes stickR{from{opacity:0; transform:translateX(26px) rotate(2.5deg) scale(.97);} 55%{opacity:1;} to{opacity:1; transform:none;}}
@keyframes stickL{from{opacity:0; transform:translateX(-26px) rotate(-2.5deg) scale(.97);} 55%{opacity:1;} to{opacity:1; transform:none;}}
.ex.out-l, .ex.back.out-l{animation:outLeft .13s ease-in both;} .ex.out-r, .ex.back.out-r{animation:outRight .13s ease-in both;}
/* 3. шторка виїжджає з перехлестом і осідає, без прозорості */
.sheet-card{animation:sheetStick .38s cubic-bezier(.34,1.4,.64,1) both; box-shadow:0 80px 0 0 var(--bg);} /* тінь-підкладка ховає щілину знизу під час перехлесту */
@keyframes sheetStick{from{transform:translateY(100%);} to{transform:none;}}
/* 5. завантаження: плитки в контурі по черзі підстрибують замість мерехтіння */
.sk div{background:var(--surface); border:2px solid var(--ink-line); box-shadow:var(--hard-sm); animation:skHop 1.2s ease-in-out infinite;}
.sk div:nth-child(2){animation-delay:.12s;} .sk div:nth-child(3){animation-delay:.24s;} .sk div:nth-child(4){animation-delay:.36s;}
.sk div:nth-child(5){animation-delay:.48s;} .sk div:nth-child(6){animation-delay:.6s;}
.sk-in{padding-top:4px; animation:fadeIn .25s ease .15s both; opacity:0;}   /* коротке завантаження не блимає */
@keyframes skHop{0%,40%,100%{transform:none;} 15%{transform:translateY(-5px);} 28%{transform:translateY(0) scale(1.02,.97);}}
/* 6. картки «приліплюються», коли відкриваєш вкладку (не при кожному перемальовуванні) */
@keyframes stickIn{from{opacity:0; transform:scale(.94) rotate(-1.5deg);} 60%{opacity:1; transform:scale(1.02) rotate(.5deg);} to{opacity:1; transform:none;}}
.sk.sk-gone{animation:skGone .2s ease both;}
@keyframes skGone{from{opacity:1;} to{opacity:0;}}
/* вкладка «Тіло»: при переході між вкладками блоки підстрибують по черзі */
#bodyView.v-in > :not(.sk){animation:hopIn .5s ease-out both;}
