#bodyView.v-in > :not(.sk):nth-child(2){animation-delay:.05s;} #bodyView.v-in > :not(.sk):nth-child(3){animation-delay:.1s;} #bodyView.v-in > :not(.sk):nth-child(4){animation-delay:.15s;}
#bodyView.v-in > :not(.sk):nth-child(5){animation-delay:.2s;} #bodyView.v-in > :not(.sk):nth-child(n+6){animation-delay:.25s;}
/* «Тиждень» і «Прогрес»: той самий пружний прижок, що й на «Програмах» / «Тілі» */
#weekView.v-in > :not(.sk):not(.wk-sk), #progressView.v-in > :not(.sk), #weekView.sk-out > :not(.sk):not(.wk-sk){animation-name:prgUp; animation-duration:.5s; animation-timing-function:ease-out; animation-fill-mode:both;}
#weekView.v-in > :nth-child(2), #progressView.v-in > :nth-child(2){animation-delay:.05s;} #weekView.v-in > :nth-child(3), #progressView.v-in > :nth-child(3){animation-delay:.1s;}
#weekView.v-in > :nth-child(4), #progressView.v-in > :nth-child(4){animation-delay:.15s;} #weekView.v-in > :nth-child(5), #progressView.v-in > :nth-child(5){animation-delay:.2s;}
#weekView.v-in > :nth-child(n+6), #progressView.v-in > :nth-child(n+6){animation-delay:.25s;}
/* шкала вправ і «+»: пружний прижок, як у кота (присів → стрибок → приземлення → дрібна пружинка) */
.seg.hop i{animation:segHop .7s linear both; transform-origin:50% 100%;}
@keyframes segHop{
  0%{transform:none; animation-timing-function:ease-out;}
  14%{transform:translateY(1px) scale(1.1,.72); animation-timing-function:cubic-bezier(.2,.8,.3,1);}
  38%{transform:translateY(-9px) scale(.94,1.18); animation-timing-function:ease-in;}
  62%{transform:translateY(0) scale(1.14,.78); animation-timing-function:ease-out;}
  78%{transform:translateY(-3px) scale(.98,1.04); animation-timing-function:ease-in;}
  90%{transform:translateY(0) scale(1.03,.97); animation-timing-function:ease-out;}
  100%{transform:none;}
}
/* при появі вкладки шкала вправ «пробігає» хвилею прижків, останнім підстрибує «+» */
.v-in .seg i{animation:segHop .7s linear both; transform-origin:50% 100%;}
.v-in .seg:nth-child(2) i{animation-delay:.05s;} .v-in .seg:nth-child(3) i{animation-delay:.1s;} .v-in .seg:nth-child(4) i{animation-delay:.15s;}
.v-in .seg:nth-child(5) i{animation-delay:.2s;} .v-in .seg:nth-child(6) i{animation-delay:.25s;} .v-in .seg:nth-child(7) i{animation-delay:.3s;}
.v-in .seg:nth-child(8) i{animation-delay:.35s;} .v-in .seg:nth-child(n+9) i{animation-delay:.4s;}
/* «Тіло»: чистий прижок без проявлення (прозорість не змінюється), скелетон з'являється одразу */
@keyframes bodyHop{0%{transform:none;} 30%{transform:translateY(-9px);} 58%{transform:translateY(0);} 78%{transform:translateY(-2px);} 100%{transform:none;}}
#bodyView.v-in > :not(.sk), #bodyView.sk-out > :not(.sk){animation-name:bodyHop;}
#bodyView .sk-in{animation:none; opacity:1;}
/* плавна поява вмісту після скелетона: блоки по черзі «приліплюються» з пружинкою */
.sk-out > :not(.sk){animation:skOut .5s ease-out both;}
.sk-out > :nth-child(2){animation-delay:.05s;} .sk-out > :nth-child(3){animation-delay:.1s;} .sk-out > :nth-child(4){animation-delay:.15s;}
.sk-out > :nth-child(5){animation-delay:.2s;} .sk-out > :nth-child(n+6){animation-delay:.25s;}
@keyframes skOut{from{opacity:0; transform:translateY(18px);} 45%{opacity:1; transform:translateY(-7px);} 70%{opacity:1; transform:translateY(0);} to{opacity:1; transform:none;}}
@keyframes hopIn{from{opacity:0; transform:translateY(18px);} 45%{opacity:1; transform:translateY(-7px);} 70%{opacity:1; transform:translateY(0);} to{opacity:1; transform:none;}}
/* ── додати / прибрати вправу в тренуванні (28.10) ── */
.seg-add{flex-shrink:0; width:36px; height:36px; margin-left:-4px; display:grid; place-items:center; padding:0; border:2px solid var(--ink-line); border-radius:10px;
  background:var(--surface); box-shadow:var(--hard-sm); color:var(--primary); transition:transform .06s ease, box-shadow .06s ease;}
.seg-add svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round;}
.seg-add:active{transform:translate(2px,2px); box-shadow:none;}
.add-g{margin:14px 2px 8px; font-size:12.5px; font-weight:800; color:var(--secondary); text-transform:lowercase;}
.add-g:first-child{margin-top:0;}
:root{--danger:#C2410C;}
:root[data-theme="dark"]{--danger:#FB923C;}
.sheet-rm{display:flex; justify-content:center; align-items:center; width:100%; margin-top:16px; color:var(--danger);}
.sheet-rm.sure{background:var(--danger); color:#fff; border-color:var(--ink-line);}
:root[data-theme="dark"] .sheet-rm.sure{color:#1A1422;}
body.struct-busy #exWrap, body.struct-busy .bar, body.struct-busy .tabs, body.struct-busy #switchBtn, body.struct-busy #rail, body.struct-busy #addEx{pointer-events:none; opacity:.6;}
/* ── «Програма»: цикл тижнів, дні тижня, мої програми (28.10) ── */
.prg-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;}
.prg-title{min-width:0;} .prg-title small{display:block; font-size:12px; font-weight:700; color:var(--secondary);}
.prg-title b{display:block; font-family:var(--display); font-size:18px; font-weight:700; line-height:1.2; overflow-wrap:anywhere;}
.prg-sec{margin:0 2px 8px; font-size:12.5px; font-weight:800; color:var(--secondary);}
.prg-cyc{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.prg-cyc button{padding:8px 12px; border-radius:12px; border:2px solid var(--ink-line); background:var(--surface); box-shadow:var(--hard-sm); font-size:13.5px; font-weight:800; line-height:1.2;}
.prg-cyc button.on{background:var(--primary); color:var(--on-primary);}
.prg-cyc button em{display:block; font-style:normal; font-size:11.5px; font-weight:700; color:var(--green-dark, var(--secondary));}
.prg-cyc button.on em{color:var(--on-primary); opacity:.85;}
.prg-days{grid-template-columns:repeat(auto-fit,minmax(48px,1fr));}
.prg-plus{min-width:44px; min-height:44px; border-radius:12px; border:2px dashed var(--ink-line); background:transparent; font-size:20px; font-weight:800; line-height:1; color:var(--primary);}
.prg-tools{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 2px 14px; font-size:12.5px; font-weight:600; color:var(--secondary);}
.prg-tools .link.sure{color:var(--danger);}
.prg-wd{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:4px 0 8px;}
.prg-wd button{min-height:36px; border-radius:10px; border:1.5px solid var(--ink-line); background:transparent; font-size:12.5px; font-weight:800; color:var(--primary);}
.prg-wd button.on{background:var(--green); color:#1A1422;}
.prg-wd button:disabled{opacity:.35; border-style:dashed;}
.lib-row{display:flex; gap:8px; align-items:stretch; margin-bottom:8px;} .lib-row .alt{flex:1; margin:0;}
.lib-del{align-self:center; flex-shrink:0;} .lib-del.sure{background:var(--danger); color:#fff;}
.lib-save{display:flex; gap:8px; margin-top:16px;} .lib-save input{flex:1; min-width:0; height:44px; padding:0 12px; border-radius:12px; border:2px solid var(--ink-line); background:var(--surface); color:var(--primary); font:inherit; font-weight:700;}
.lib-new{width:100%; margin-top:8px;}
/* ── самопочуття перед тренуванням (28.10) ── */
.well-card{margin-bottom:16px; padding:14px 16px;}
.well-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;} .well-h b{font-size:14.5px; font-weight:800;}
.well-row{display:grid; grid-template-columns:48px 1fr; align-items:center; gap:8px; margin-top:8px;} .well-row > span{font-size:13px; font-weight:700; color:var(--secondary);}
.well-seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.well-seg button{min-height:40px; border-radius:12px; border:2px solid var(--ink-line); background:var(--surface); font-size:13.5px; font-weight:800; color:var(--primary); box-shadow:var(--hard-sm); transition:transform .06s ease, box-shadow .06s ease;}
.well-seg button.on{background:var(--green); color:#1A1422;}
.well-seg button:active{transform:translate(2px,2px); box-shadow:none;}
/* 28.10: «Як ти сьогодні» — тихий блок на тлі сторінки: без контуру й тіні, сегменти в одній «доріжці» */
.well-card{margin:0 0 20px; padding:2px 2px 0;}
.well-h{align-items:center; margin-bottom:8px;} .well-h b{font-size:13.5px; color:var(--secondary);}
.well-row{grid-template-columns:44px 1fr; margin-top:6px;} .well-row > span{font-size:12.5px;}
.well-seg{gap:0; padding:3px; border-radius:14px; background:var(--surface); border:2px solid var(--ink-line); box-shadow:var(--hard-sm);}
.well-row > span{line-height:1;}
.well-seg button{min-height:40px; border:2px solid transparent; border-radius:10px; background:transparent; box-shadow:none; font-size:13px; color:var(--secondary);
  transition:background .18s ease, color .18s ease, border-color .18s ease, transform .06s ease;}
.well-seg button.on{background:var(--green); color:#1A1422; border-color:var(--ink-line); box-shadow:var(--hard-sm); animation:pop .28s ease;}
.well-seg button:active{transform:scale(.96); box-shadow:none;}
.well-x{position:relative; width:28px; height:28px; margin:-4px -4px -4px 0; display:grid; place-items:center; padding:0; border:none; border-radius:50%; background:none; color:var(--secondary);}
.well-x::after{content:''; position:absolute; inset:-8px;}
.well-x svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round;}
.well-line{display:block; margin:-4px 0 12px; padding:2px 0; background:none; border:none; font-size:12.5px; font-weight:600; color:var(--secondary);}
.well-line b{color:var(--primary); font-weight:800;}
/* ── суперсети (28.10) ── */
.prg-ss{display:block; margin:-4px auto 10px; padding:6px 12px; border-radius:10px; border:1.5px dashed var(--ink-line); background:transparent; font-size:12.5px; font-weight:800; color:var(--secondary);}
.prg-ss.on{border-style:solid; background:var(--green); color:#1A1422;}
.prg-ss:disabled{opacity:.35;}
/* ── «Програма» перекомпонована (28.10): три смислові блоки з повітрям між ними, дії з вправою — у шторці ── */
.prg-head{margin-bottom:28px;}
.prg-blk{margin-bottom:28px;}
.prg-blk .prg-sec{margin-bottom:10px;}
.prg-cyc, .prg-days{margin-bottom:0;}
.prg-days{display:flex; gap:8px;}
.prg-days button[data-d]{flex:1 1 0; min-width:0; padding:10px 4px;}
.prg-cyc{gap:8px;}
.prg-plus{flex:0 0 48px; min-width:48px;}
.prg-blk .prg-tools{margin:12px 2px 0;}
.prg-tools span{color:var(--secondary);}
.prg-it{padding:16px 16px 16px;}
.prg-top{align-items:center; margin-bottom:16px;}
.prg-no{margin-top:0;}
.prg-more{flex-shrink:0; position:relative; width:36px; height:36px; margin:-6px -8px -6px 0; display:grid; place-items:center; padding:0; border:none; border-radius:10px; background:none; color:var(--secondary);}
.prg-more::after{content:''; position:absolute; inset:-4px;}
.prg-more svg{width:20px; height:20px; fill:currentColor;}
.prg-more:active{background:var(--sunk);}
.prg-list .prg-it + .prg-it{margin-top:16px;}
.prg-list .prg-ssl + .prg-it{margin-top:0;}
.prg-ssl{display:flex; justify-content:center; position:relative; height:28px;}
.prg-ssl::before{content:''; position:absolute; top:-2px; bottom:-2px; left:50%; border-left:3px solid var(--ink-line);}
.prg-ssl span{position:relative; align-self:center; padding:2px 10px; border-radius:999px; border:2px solid var(--ink-line); background:var(--green); color:#1A1422; font-size:11.5px; font-weight:800;}
.prg-add{margin:20px 0 0;}
/* зміна дня / тижня: картки по черзі в'їжджають збоку переходу, без повороту (високий список, що крутиться, виглядав криво) */
.prg-ex.in-r .prg-it, .prg-ex.in-l .prg-it, .prg-ex.in-r .prg-ssl, .prg-ex.in-l .prg-ssl{animation:prgInR .5s ease-out both;}
.prg-ex.in-l .prg-it, .prg-ex.in-l .prg-ssl{animation-name:prgInL;}
.prg-ex .prg-list > :nth-child(2){animation-delay:.04s;} .prg-ex .prg-list > :nth-child(3){animation-delay:.08s;}
.prg-ex .prg-list > :nth-child(4){animation-delay:.12s;} .prg-ex .prg-list > :nth-child(5){animation-delay:.16s;}
.prg-ex .prg-list > :nth-child(n+6){animation-delay:.2s;}
@keyframes prgInR{0%{transform:translateX(16px);} 30%{transform:translate(0,-9px);} 58%{transform:translate(0,0);} 78%{transform:translateY(-2px);} 100%{transform:none;}}
@keyframes prgInL{0%{transform:translateX(-16px);} 30%{transform:translate(0,-9px);} 58%{transform:translate(0,0);} 78%{transform:translateY(-2px);} 100%{transform:none;}}
@keyframes prgUp{0%{transform:none;} 30%{transform:translateY(-9px);} 58%{transform:translateY(0);} 78%{transform:translateY(-2px);} 100%{transform:none;}}
.prg-cyc button.pop, .prg-days button.pop, .prg-wd button.pop{animation:pop .3s ease;}
/* шторка дій */
.prg-opts{display:grid; gap:8px;}
.prg-opt{display:flex; align-items:center; gap:12px; width:100%; min-height:50px; padding:0 14px; border-radius:var(--r-sm); border:2px solid var(--ink-line); background:var(--surface);
  box-shadow:var(--hard-sm); font-size:14.5px; font-weight:800; color:var(--primary); text-align:left; transition:transform .06s ease, box-shadow .06s ease, background .15s ease;}
.prg-opt svg{width:18px; height:18px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.prg-opt:active:not(:disabled){transform:translate(2px,2px); box-shadow:none;}
.prg-opt:disabled{opacity:.35; box-shadow:none;}
.prg-opt.danger{color:var(--danger);}
.prg-opt.danger.sure{background:var(--danger); color:#fff;}
:root[data-theme="dark"] .prg-opt.danger.sure{color:#1A1422;}
/* день тижня у шторці: ті самі кнопки-наліпки з натиском */
.prg-wd{gap:6px; margin:0 0 20px;}
.prg-wd button{min-height:44px; border:2px solid var(--ink-line); border-radius:12px; background:var(--surface); box-shadow:var(--hard-sm);
  transition:transform .06s ease, box-shadow .06s ease, background .18s ease, color .18s ease;}
.prg-wd button:active:not(:disabled){transform:translate(2px,2px); box-shadow:none;}
.prg-wd button:disabled{box-shadow:none; background:transparent;}
.prg-cyc button, .prg-plus{transition:transform .06s ease, box-shadow .06s ease, background .18s ease, color .18s ease;}
.prg-cyc button:active, .prg-plus:active{transform:translate(2px,2px); box-shadow:none;}
/* панель збереження: з'являється лише коли є що зберегти, стоїть над нижніми вкладками */
.prg-save{position:fixed; left:0; right:0; margin:0 auto; width:calc(100% - 36px); max-width:484px; bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom)); z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  padding:12px 12px 12px 16px; border:2px solid var(--ink-line); box-shadow:var(--hard-sm); background:var(--surface); backdrop-filter:none; -webkit-backdrop-filter:none;
  animation:barUp .3s cubic-bezier(.34,1.4,.64,1) both;}
.prg-save #pgMsg{flex:1 1 140px; min-width:0; font-size:13px; font-weight:700; line-height:1.35; color:var(--primary);}
.prg-save-b{display:flex; gap:8px; margin-left:auto;}
.prg-save .btn{min-height:44px; padding:0 16px; white-space:nowrap;}
#pgLib{white-space:nowrap; flex-shrink:0;}
/* вузький екран: повторення — на весь ряд, підходи й відпочинок під ними, щоб нічого не обрізалось */
@media (max-width:360px){
  .prg-f{grid-template-columns:repeat(2,minmax(0,1fr));}
  .prg-f .prg-rng{grid-column:1 / -1; order:-1;}
  #pgLib{padding:0 12px;}
}
/* панель стоїть поверх сторінки — знизу додаємо місце, щоб «+ Додати вправу» не ховалась під нею */
#programView.has-bar{padding-bottom:110px;}
.prg-save.still{animation:none;}
@keyframes barUp{from{transform:translateY(16px);} to{transform:none;}}
/* «приліп» при відкритті вкладки — однаково для всіх блоків, по черзі */
.v-in .prg-head, .v-in .prg-blk:not(.prg-ex), .v-in .prg-ex .prg-it, .v-in .prg-ex .prg-ssl, .v-in .prg-add{animation:prgUp .5s ease-out both;}
.v-in .prg-blk:nth-of-type(1){animation-delay:.04s;} .v-in .prg-blk:nth-of-type(2){animation-delay:.08s;}
.v-in .prg-ex .prg-list > :nth-child(1){animation-delay:.12s;} .v-in .prg-ex .prg-list > :nth-child(2){animation-delay:.16s;}

:root{--tabh:60px; --tic-fill:#FFFFFF;}
body{padding-bottom:calc(140px + var(--tabh));}
body.resting{padding-bottom:calc(196px + var(--tabh));}
.tabs.tabs{position:fixed; left:0; right:0; bottom:0; z-index:32; margin:0; display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  background:var(--bar-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:2px solid var(--ink-line); border-radius:0;
  padding:6px max(10px, calc((100% - 520px) / 2 + 10px)) calc(6px + env(safe-area-inset-bottom));}

  border:2px solid transparent; border-radius:14px; background:none; box-shadow:none; color:var(--secondary); font-size:10.5px; font-weight:800; letter-spacing:-.01em; line-height:1;}

.tic{width:29px; height:29px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.tic .a{fill:transparent;} .tic .f{fill:var(--surface);}
.tabs button.on .tic .a, .tabs button.on .tic .f{fill:var(--tic-fill);}
.tabs.tabs .dot{position:absolute; top:5px; left:calc(50% + 9px); margin:0;}
.bar{bottom:calc(var(--tabh) + env(safe-area-inset-bottom)); padding-bottom:10px;}
.rest{bottom:calc(88px + var(--tabh) + env(safe-area-inset-bottom));}
.rest.low{bottom:calc(14px + var(--tabh) + env(safe-area-inset-bottom));}
.top-l{flex:1;}
.day-act{display:inline-grid; place-items:center; width:30px; height:30px; border:2px solid var(--ink-line); border-radius:10px; background:var(--surface); color:var(--primary); box-shadow:var(--hard-sm);}
.day-act svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.day-act:active{transform:translate(1px,1px); box-shadow:none;}

/* Програма: кіт ліворуч від назви програми, у шапці */
.mc-flex{background-image:none}
.prg-head .pg-cat{flex:0 0 auto; width:58px; height:74px; margin:-8px -2px -8px -4px; --rot:3deg; transform:rotate(3deg);}
.prg-head .prg-cat{flex:0 0 auto; width:56px; height:72px; margin:-8px -2px -8px -4px; --rot:-4deg; transform:rotate(-4deg);}
.prg-head .prg-title{flex:1 1 auto;}
/* Тіло: кіт стоїть на вагах просто на верхній грані першої картки, праворуч */
.bd-cat{display:flex; justify-content:flex-end; padding-right:22px; margin:2px 0 -3px; position:relative; z-index:1; pointer-events:none;}
.bd-cat .mc{pointer-events:auto; flex:0 0 auto; width:50px; height:88px; --rot:3deg; transform:rotate(3deg);}
@media (max-width:340px){ .prg-head .pg-cat{width:48px; height:61px;} .prg-head .prg-cat{width:46px; height:60px;} .bd-cat .mc{width:44px; height:78px;} }
/* ноги кота не перекриваються білим під час анімації вкладок «Програма» і «Тіло»: блоки під час стрибка (transform) створюють власний шар і лягали поверх лап — тримаємо кота вище */
.prg-head{position:relative; z-index:3;}
.bd-cat{z-index:3;}
.prg-head .mc, .bd-cat .mc{position:relative; z-index:3;}

<script>
var BACKUP_URL = 'https://diary-backup.marrcotos.workers.dev';
/* Дані живуть лише в цьому браузері (localStorage). Сервера немає.
   LOCAL повторює те, що робив Code.gs: payload / saveDay / saveGoal / saveHeight. */
var LOCAL = (function(){
  var KEY = 'rirDiaryData';
  var NUMS = { kg: [30, 300], steps: [0, 200000], kcal: [0, 20000], p: [0, 2000], f: [0, 2000], c: [0, 2000] };
  var LABEL = { kg: 'Вага', steps: 'Кроки', kcal: 'Калорії', p: 'Білки', f: 'Жири', c: 'Вуглеводи' };
  var LV = ['sleep', 'energy', 'mood', 'motiv'];
  var NOTE_MAX = 1000;
  var ISO = /^\d{4}-\d{2}-\d{2}$/;

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function today(){ var t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
  function tomorrow(){ var t = new Date(); t.setDate(t.getDate() + 1); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
  function okDate(s){
    s = String(s == null ? '' : s).trim();
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return '';
    var t = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return t.getUTCMonth() === +m[2] - 1 && t.getUTCDate() === +m[3] ? s : '';
  }
  function num(v){
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    var s = String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.');
    if (s === '') return null;
    if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
    return Number(s);
  }
  function r2(x){ return Math.round(x * 100) / 100; }
  function blank(){ return { height: null, goals: [], days: {} }; }

  /** Перевіряє й очищає дані (зі сховища або з файлу копії). Сміття відкидає, а не падає. */
  function clean(o){
    if (!o || typeof o !== 'object') throw new Error('Це не файл копії щоденника');
    var d = blank();
    var h = num(o.height); if (h !== null && !isNaN(h) && h >= 100 && h <= 250) d.height = r2(h);
    (Array.isArray(o.goals) ? o.goals : []).forEach(function(g){
      if (!g || !okDate(g.from)) return;
      var x = { from: g.from };
      [['kcal', 500, 10000], ['p', 10, 500], ['steps', 500, 100000]].forEach(function(r){
        var n = num(g[r[0]]); x[r[0]] = n !== null && !isNaN(n) && n >= r[1] && n <= r[2] ? Math.round(n) : null;
      });
      d.goals = d.goals.filter(function(y){ return y.from !== x.from; }); d.goals.push(x);
    });
    d.goals.sort(function(a, b){ return a.from < b.from ? -1 : 1; });
    var days = o.days && typeof o.days === 'object' ? o.days : {};
    Object.keys(days).forEach(function(ds){
      var src = days[ds]; if (!okDate(ds) || !src || typeof src !== 'object') return;
      var e = {}, any = false;
      Object.keys(NUMS).forEach(function(k){
        var n = num(src[k]); if (n !== null && !isNaN(n) && n >= NUMS[k][0] && n <= NUMS[k][1]){ e[k] = r2(n); any = true; }
      });
      LV.forEach(function(k){ var n = src[k]; if (n === 0 || n === 1 || n === 2){ e[k] = n; any = true; } });
      var note = String(src.note == null ? '' : src.note).replace(/\r/g, '').trim().slice(0, NOTE_MAX);
      if (note){ e.note = note; any = true; }
      if (any) d.days[ds] = e;
    });
    return d;
  }

  // щоразу читаємо свіже: інша вкладка чи іконка на екрані могла щойно записати своє
  function load(){
    var raw = null, o;
    try { raw = localStorage.getItem(KEY); } catch (e) { throw new Error('Браузер не дає зберігати дані. Вийди з приватного режиму.'); }
    if (!raw) return blank();
    try { o = JSON.parse(raw); } catch (e) { throw new Error('Записи на телефоні пошкоджено. Віднови їх з файлу копії: кнопка «Дані» вгорі.'); }
    return clean(o);
  }
  function save(d){
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { throw new Error('Не вдалося зберегти на телефоні'); }
    try { if (window.onDiarySaved) window.onDiarySaved(); } catch (e) {}
  }

  function payload(){
    var d = load(), list = [], days = [];
    Object.keys(d.days).sort().forEach(function(ds){
      var s = d.days[ds], e = { d: ds }, any = false;
      if (s.kg != null) list.push({ d: ds, kg: s.kg });
      ['steps', 'kcal', 'p', 'f', 'c'].concat(LV).forEach(function(k){ e[k] = s[k] != null ? s[k] : null; if (e[k] !== null) any = true; });
      if (s.note){ e.note = s.note; any = true; }
      if (any) days.push(e);
    });
    return JSON.parse(JSON.stringify({ height: d.height, list: list, days: days, goals: d.goals, today: today() }));
  }

  function saveDay(p){
    p = p || {};
    var date = okDate(p.date);
    if (!date) throw new Error('Невідома дата');
    if (date > tomorrow()) throw new Error('Цей день ще не настав');
    var vals = {};
    Object.keys(NUMS).forEach(function(k){
      if (!(k in p)) return;
      var n = num(p[k]);
      if (n !== null && (isNaN(n) || n < NUMS[k][0] || n > NUMS[k][1])) throw new Error(k === 'kg' ? 'Вага — від 30 до 300 кг' : 'Перевір поле «' + LABEL[k] + '»');
      vals[k] = n === null ? null : r2(n);
    });
    LV.forEach(function(k){
      if (!(k in p)) return;
      var raw = String(p[k] == null ? '' : p[k]).trim();
      if (raw === '') { vals[k] = null; return; }
      if (!/^[0-2]$/.test(raw)) throw new Error('Невідоме значення стану');
      vals[k] = Number(raw);
    });
    if ('note' in p){
      var txt = String(p.note == null ? '' : p.note).replace(/\r/g, '').trim();
      if (txt.length > NOTE_MAX) throw new Error('Нотатка задовга — до ' + NOTE_MAX + ' символів');
      vals.note = txt || null;
    }
    if (!Object.keys(vals).length) return payload();
    var d = JSON.parse(JSON.stringify(load()));
    var e = d.days[date] || {};
    Object.keys(vals).forEach(function(k){ if (vals[k] === null) delete e[k]; else e[k] = vals[k]; });
    if (Object.keys(e).length) d.days[date] = e; else delete d.days[date];
    save(d);
    return payload();
  }

  function saveGoal(p){
    p = p || {};
    var from = okDate(p.from);
    if (!from) throw new Error('Невідома дата');
    if (from > tomorrow()) throw new Error('Цей день ще не настав');
    var kcal = num(p.kcal), pr = num(p.p), st = num(p.steps);
    if (kcal !== null && (isNaN(kcal) || kcal < 500 || kcal > 10000)) throw new Error('Ціль калорій — від 500 до 10 000');
    if (pr !== null && (isNaN(pr) || pr < 10 || pr > 500)) throw new Error('Ціль білка — від 10 до 500 г');
    if (st !== null && (isNaN(st) || st < 500 || st > 100000)) throw new Error('Ціль кроків — від 500 до 100 000');
    var d = JSON.parse(JSON.stringify(load()));
    d.goals = d.goals.filter(function(g){ return g.from !== from; });
    d.goals.push({ from: from, kcal: kcal === null ? null : Math.round(kcal), p: pr === null ? null : Math.round(pr), steps: st === null ? null : Math.round(st) });
    d.goals.sort(function(a, b){ return a.from < b.from ? -1 : 1; });
    save(d);
    return payload();
  }

  function saveHeight(p){
    var cm = num(p && p.cm);
    if (cm !== null && (isNaN(cm) || cm < 100 || cm > 250)) throw new Error('Ріст — від 100 до 250 см');
    var d = JSON.parse(JSON.stringify(load()));
    d.height = cm === null ? null : r2(cm);
    save(d);
    return payload();
  }

  /** Файл копії: { app, v, saved, height, goals, days } */
  function exportObj(){
    var d = load();
    return { app: 'rir-diary', v: 1, saved: new Date().toISOString(), height: d.height, goals: d.goals, days: d.days };
  }
  function parseFile(text){
    var o; try { o = JSON.parse(text); } catch (e) { throw new Error('Не вдалося прочитати файл'); }
    if (!o || o.app !== 'rir-diary') throw new Error('Це не файл копії щоденника');
    return clean(o);
  }
  function replaceAll(d){ save(clean(d)); }
  function isEmpty(){ var d = load(); return !Object.keys(d.days).length && !d.goals.length && d.height == null; }

  return { payload: payload, getBody: function(){ return payload(); }, saveDay: saveDay, saveGoal: saveGoal, saveHeight: saveHeight,
    exportObj: exportObj, parseFile: parseFile, replaceAll: replaceAll, isEmpty: isEmpty, today: today };
})();

/* Замість google.script.run: ті самі виклики, але до LOCAL, асинхронно, як і раніше. */
var google = { script: {} };
Object.defineProperty(google.script, 'run', { get: function(){
  var ok = function(){}, bad = function(){};
  var r = { withSuccessHandler: function(f){ ok = f; return r; }, withFailureHandler: function(f){ bad = f; return r; } };
  ['getBody', 'saveDay', 'saveGoal', 'saveHeight'].forEach(function(n){
    r[n] = function(a){ var res, err = null; try { res = LOCAL[n](a); } catch (e) { err = e; } setTimeout(function(){ if (err) bad(err); else ok(res); }, 0); };
  });
  return r;
} });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
/* запис з іншої вкладки — підтягуємо, щоб наступне збереження не затерло його */
window.addEventListener('storage', function(e){
  if (e.key !== 'rirDiaryData' || typeof BODY === 'undefined' || !BODY.data) return;
  try { BODY.data = LOCAL.payload(); bodyRefresh(); } catch (er) {}
});

var BOOT; try { BOOT = LOCAL.payload(); } catch (e) { BOOT = { error: errMsg(e) }; }
function errMsg(e){ return (e && e.message) ? e.message : String(e); }
</script>
<script>
var view = 'body';
var MON = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
var MON3 = ['січ.','лют.','бер.','квіт.','трав.','черв.','лип.','серп.','вер.','жовт.','лист.','груд.'];
var MON_SHORT = ['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
var WD_ORDER = ['понеділок', 'вівторок', 'середа', 'четвер', "п'ятниця", 'субота', 'неділя'];
var ISO_D = /^\d{4}-\d\d-\d\d$/;
var DARK = document.documentElement.getAttribute('data-theme') === 'dark';
var CAL_ICO = '<svg class="bc-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(i){ return document.getElementById(i); }
function errText(e){ return (e && e.message) ? e.message : String(e); }
function norm(s){ return String(s == null ? '' : s).toLowerCase().replace(/[’ʼ`´‘]/g, "'").replace(/\s+/g, ' ').trim(); }
function has(v){ return v != null && String(v).trim() !== ''; }
function num(v){ if (!has(v)) return 0; var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; }
function fmtW(n){ return String(Math.round(num(n) * 100) / 100).replace('.', ','); }
function fmtN(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtDate(s){ var p = String(s).split('-'); return p.length === 3 ? (+p[2]) + ' ' + MON[+p[1] - 1] : s; }
function fmtShort(s){ var p = String(s).split('-'); return p.length === 3 ? (+p[2]) + ' ' + MON3[+p[1] - 1] : s; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/**

function dayChart2(by, key, kind, from, to, fy, unit){

  var yv = vals.concat(maV.filter(function(v){ return v != null; }));
  var yt = kind === 'line' ? niceTicks(Math.min.apply(null, yv), Math.max.apply(null, yv), 4) : niceTicks(0, Math.max.apply(null, vals) * 1.05, 4, true);
  G.Y = function(v){ return G.T + (G.VH - G.T - G.B) * (1 - (v - yt.lo) / (yt.hi - yt.lo)); };
  var o = '<svg class="chart dch2" viewBox="0 0 ' + G.VW + ' ' + G.VH + '" role="img" aria-label="' + esc(unit.aria) + '">' + chartFrame(G, yt, fy, from, to);

    var li = items[items.length - 1], lm = ma[ma.length - 1];

    items.forEach(function(it, i){
      var x = G.X(it.d0), pv = i ? G.X(items[i - 1].d0) : G.L, nx = i < items.length - 1 ? G.X(items[i + 1].d0) : G.VW - G.R;

      }

/**
 * Прогнозований 1ПМ по тренуваннях. pts — [{d: 'YYYY-MM-DD', v: кг, set: '57,5 кг × 8'}], за датою.
 * Вісь X — справжній час (рівні проміжки між тижнями), лінія + заливка, кожне тренування — точка.
 */
/** Темп за період: вага — нахил прямої (кг за тиждень), решта — середнє за день серед днів із записом. */
function periodStats(by, from, to){
  var xs = [], ys = [], sum = { steps: [], kcal: [], p: [], f: [], c: [] };
  for (var d = from; d <= to; d++){
    var e = by[dayStr(d)]; if (!e) continue;
    if (e.kg != null){ xs.push(d); ys.push(e.kg); }
    Object.keys(sum).forEach(function(k){ if (e[k] != null) sum[k].push(e[k]); });
  }
  var out = { n: xs.length, kg: avgOf(ys) };
  if (xs.length >= 3 && xs[xs.length - 1] - xs[0] >= 6){
    var mx = avgOf(xs), my = avgOf(ys), num = 0, den = 0;
    xs.forEach(function(x, i){ num += (x - mx) * (ys[i] - my); den += (x - mx) * (x - mx); });
    out.pace = den ? num / den * 7 : null;
    var first = ys.filter(function(_, i){ return xs[i] < xs[0] + 7; }), lastW = ys.filter(function(_, i){ return xs[i] > xs[xs.length - 1] - 7; });
    out.kg0 = avgOf(first); out.kg1 = avgOf(lastW);
  }
  Object.keys(sum).forEach(function(k){ out[k] = avgOf(sum[k]); out[k + 'N'] = sum[k].length; });
  if (out.p != null && out.f != null && out.c != null){
    var kc = out.p * 4 + out.f * 9 + out.c * 4;
    out.pct = kc ? [out.p * 4 / kc, out.f * 9 / kc, out.c * 4 / kc].map(function(x){ return Math.round(x * 100); }) : null;
  }
  return out;
}

/* Календар: місяць, дні з записом, підсумок місяця. Дотик по дню відкриває його. */
var CAL = { m: null };
/* позначки на дні календаря: що записано */
var CAL_MK = [
  ['вага', 'var(--primary)', function(e){ return e.kg != null; }],
  ['їжа', 'var(--mac-f)', function(e){ return e.kcal != null || e.p != null || e.f != null || e.c != null; }],
  ['кроки', 'var(--mac-c)', function(e){ return e.steps != null; }],
  ['нотатка', 'var(--surface)', function(e){ return !!e.note; }],
  ['у цілі', 'var(--green)', function(e, ds){ var r = goalHit(e, ds); return r.n > 0 && r.ok === r.n; }]
];
/* Ціль, що діє в день ds: остання з from <= ds. Ккал — не більше цілі, білок — не менше. */
function goalAt(ds){ var g = null; ((BODY.data && BODY.data.goals) || []).forEach(function(x){ if (x.from <= ds) g = x; }); return g && (g.kcal != null || g.p != null || g.steps != null) ? g : null; }
function goalOk(k, v, t){ return k === 'kcal' ? v <= t : v >= t; }   // як на смужці: за округленим числом
function goalHit(e, ds){
  var g = goalAt(ds), r = { n: 0, ok: 0 };
  if (!g || !e) return r;
  ['kcal', 'p', 'steps'].forEach(function(k){ if (g[k] != null && e[k] != null){ r.n++; if (goalOk(k, e[k], g[k])) r.ok++; } });
  return r;
}
/** Скільки днів періоду в цілі: «у цілі 18 з 25 дн.» (лише дні, де є і запис, і ціль). */
function goalCount(by, from, to, k){
  var n = 0, ok = 0;
  for (var d = from; d <= to; d++){ var ds = dayStr(d), e = by[ds], g = goalAt(ds); if (e && g && g[k] != null && e[k] != null){ n++; if (goalOk(k, e[k], g[k])) ok++; } }
  return { n: n, ok: ok };
}
function goalSub(by, from, to, k){ var c = goalCount(by, from, to, k); return c.n ? (k === 'p' ? 'білок ' : '') + 'у цілі ' + c.ok + ' з ' + c.n + ' дн.' : ''; }

function drawCal(){

  }

  var html = '<div class="bc-nav"><button type="button" class="icon-btn" id="calPrev" aria-label="Попередній місяць"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>' +
    '<b>' + esc(['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'][mo - 1] + ' ' + y) + '</b>' +
    '<button type="button" class="icon-btn" id="calNext" aria-label="Наступний місяць"' + (canNext ? '' : ' disabled') + '><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>' +
    '<div class="bc-g">' + g + '</div>' +
    ((D.goals || []).length ? '<div class="cal-lg"><span><svg class="cal-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>усі цілі дня виконано</span></div>' : '') +
    (function(){ var gg = goalAt(BODY.date); return '<div class="gl-row"><span>' + (gg ? 'Ціль з ' + esc(fmtDate(BODY.date === gg.from ? gg.from : gg.from)) + ': ' + [gg.kcal != null ? '≤ ' + esc(fmtN(gg.kcal)) + ' ккал' : '', gg.p != null ? 'білок ≥ ' + esc(fmtN(gg.p)) + ' г' : '', gg.steps != null ? 'кроки ≥ ' + esc(fmtN(gg.steps)) : ''].filter(Boolean).join(' · ') : 'Ціль не задано') + '</span><button type="button" class="link" id="calGoal">' + (gg ? 'Змінити' : 'Задати') + '</button></div>'; })();

/* Автокопія: телефон шифрує записи паролем і відправляє шифр на сервер. Пароль і записи нікуди не йдуть.
   Пароль → PBKDF2 (600 000 кроків) → 512 біт: перші 256 — ключ AES-GCM, другі 256 — токен, за яким сервер знаходить копію. */
var CLOUD = (function(){
  var SALT = 'rir-diary-backup-v1', ITER = 600000, SK = 'rirDiaryCloud';
  var timer = null, sending = false, again = false;
  function b64(buf){ var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s){ var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  function hex(a){ return Array.prototype.map.call(a, function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function st(v){ try { if (v === undefined){ var s = localStorage.getItem(SK); return s ? JSON.parse(s) : null; } if (v === null) localStorage.removeItem(SK); else localStorage.setItem(SK, JSON.stringify(v)); } catch (e) { return null; } }
  function on(){ return !!(BACKUP_URL && st() && st().t); }

  function derive(pw){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveBits']).then(function(base){
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(SALT), iterations: ITER }, base, 256);
    }).then(function(bits){ return crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveBits']); }).then(function(h){
      var part = function(info){ return crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: enc.encode(info) }, h, 256); };
      return Promise.all([part('key'), part('token')]);
    }).then(function(r){ return { k: b64(r[0]), t: hex(new Uint8Array(r[1])) }; });
  }
  function aes(k){ return crypto.subtle.importKey('raw', unb64(k), 'AES-GCM', false, ['encrypt', 'decrypt']); }
  function seal(k, obj){
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return aes(k).then(function(key){ return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj))); })
      .then(function(ct){ return JSON.stringify({ v: 1, iv: b64(iv), ct: b64(ct) }); });
  }
  function open(k, text){
    var o = JSON.parse(text);
    return aes(k).then(function(key){ return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, key, unb64(o.ct)); })
      .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); }, function(){ throw new Error('Не вдалося розшифрувати копію'); });
  }

  /* мережа: справжній сервер або, у демо, імітація в цьому ж браузері */
  function net(method, t, body, keep){
    if (BACKUP_URL === 'demo') return new Promise(function(res, rej){ setTimeout(function(){
      var db = {}; try { db = JSON.parse(localStorage.getItem('rirDiaryFakeServer') || '{}'); } catch (e) {}
      if (method === 'PUT'){ db[t] = body; try { localStorage.setItem('rirDiaryFakeServer', JSON.stringify(db)); } catch (e) { rej(new Error('Не вдалося надіслати')); return; } res('ok'); }
      else res(db[t] == null ? null : db[t]);
    }, 400); });
    return fetch(BACKUP_URL.replace(/\/$/, '') + '/backup', { method: method, headers: { 'X-Token': t, 'Content-Type': 'application/json' }, body: body, keepalive: !!keep, cache: 'no-store' })
      .then(function(r){
        if (method === 'GET' && r.status === 404) return null;
        if (!r.ok) throw new Error('Сервер відповів ' + r.status);
        return r.text();
      }, function(){ throw new Error('Немає зв’язку з сервером'); });
  }
  function fetchCopy(t){ return net('GET', t); }

  /** Надіслати поточні записи. Порожній телефон ніколи не затирає непорожню копію. */
  function push(keep){
    var s = st(); if (!on()) return Promise.resolve();
    if (sending){ again = true; return Promise.resolve(); }
    var obj; try { obj = LOCAL.exportObj(); } catch (e) { return Promise.resolve(); }
    var n = Object.keys(obj.days).length;
    if (!n && s.n) return Promise.resolve();
    sending = true; s.dirty = true; st(s);
    var ver = s.ver || 0;
    return seal(s.k, obj).then(function(body){
      if (keep && body.length > 60000) keep = false;
      return net('PUT', s.t, body, keep);
    }).then(function(){
      var s2 = st(); if (s2 && s2.t === s.t){ s2.err = ''; s2.last = new Date().toISOString(); s2.n = n; if ((s2.ver || 0) === ver) s2.dirty = false; else again = true; st(s2); }
    }, function(e){
      var s2 = st(); if (s2 && s2.t === s.t){ s2.err = errText(e); st(s2); }
    }).then(function(){
      sending = false; if (typeof cloudPaint === 'function') cloudPaint();
      if (again){ again = false; clearTimeout(timer); timer = setTimeout(function(){ push(); }, 3000); }
    });
  }
  function soon(ms){ if (!on()) return; var s = st(); s.dirty = true; s.ver = (s.ver || 0) + 1; st(s); clearTimeout(timer); timer = setTimeout(function(){ push(); }, ms == null ? 15000 : ms); }

  /** Увімкнути з паролем. Повертає { copy } — розшифровану наявну копію за цим паролем (або null). */
  function check(pw){
    return derive(pw).then(function(keys){
      return fetchCopy(keys.t).then(function(text){
        if (text == null) return { keys: keys, copy: null };
        return open(keys.k, text).then(function(o){ return { keys: keys, copy: o }; });
      });
    });
  }
  function enable(keys){ st({ k: keys.k, t: keys.t, dirty: true, last: '', err: '', n: 0 }); return push(); }
  function disable(){ clearTimeout(timer); st(null); }

  // після кожного запису — відправка за 15 с; коли застосунок ховають — одразу; при появі інтернету — довідправка
  window.onDiarySaved = function(){ soon(); };
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden' && on() && st().dirty){ clearTimeout(timer); setTimeout(function(){ push(true); }, 50); } });
  window.addEventListener('online', function(){ if (on() && st().dirty) push(); });
  setTimeout(function(){ if (on() && st().dirty) push(); }, 2000);
  setInterval(function(){ if (on() && st().dirty && st().err && navigator.onLine !== false) push(); }, 60000);

  return { on: on, state: st, check: check, enable: enable, disable: disable, push: push };
})();
/* «Дані»: копія у файл і відновлення з файлу. Дані є лише на цьому телефоні. */
var ICO_DATA = '<svg viewBox="0 0 24 24"><path d="M12 3.5v10M8 9.5l4 4 4-4"/><path d="M4 14.5v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/></svg>';
el('dataBtn').innerHTML = ICO_DATA;
function afterSaves(fn, n){
  n = n || 0;
  if ((BODY.busy || (BODY.q && BODY.q.length)) && n < 100){ setTimeout(function(){ afterSaves(fn, n + 1); }, 30); return; }
  fn();
}
function lastCopyText(){
  var s = store('LastCopy');
  return s && ISO_D.test(s) ? 'Остання копія: ' + fmtDate(s) + (s.slice(0, 4) !== LOCAL.today().slice(0, 4) ? ' ' + s.slice(0, 4) : '') : 'Копії ще не було';
}
function drawData(msg){
  el('sheetTitle').textContent = 'Дані';
  el('sheetSub').textContent = CLOUD.on() ? 'Записи зберігаються на цьому телефоні, а зашифрована копія — в інтернеті.' : 'Записи зберігаються лише на цьому телефоні.';
  el('sheetList').innerHTML =
    '<div class="dt-acts"><button type="button" class="btn' + (CLOUD.on() ? '' : ' pri') + '" id="dtSave">Зберегти копію у файл</button>' +
    '<button type="button" class="btn" id="dtLoad">Відновити з файлу</button></div>' +
    '<div class="dt-last">' + esc(lastCopyText()) + '</div>' +
    '<div class="bd-msg" id="dtMsg" aria-live="polite">' + esc(msg || '') + '</div>' +
    '<input type="file" id="dtFile" accept=".json,application/json" class="hidden">' +
    (BACKUP_URL ? '<div class="dt-sep"></div><div class="dt-h">Автокопія</div>' + (CLOUD.on()
      ? '<div class="dt-st" id="dtCloudSt"></div><div class="dt-acts"><button type="button" class="btn" id="dtOff">Вимкнути автокопію</button></div>'
      : '<div class="dt-st">Записи шифруються твоїм паролем і самі зберігаються в інтернеті. Без пароля їх не прочитати.</div>' +
        '<div class="dt-acts"><button type="button" class="btn pri" id="dtOn">Увімкнути автокопію</button><button type="button" class="btn" id="dtFind">Відновити з автокопії</button></div>') : '');
  if (el('dtOn')) el('dtOn').addEventListener('click', function(){ drawPw('on'); });
  if (el('dtFind')) el('dtFind').addEventListener('click', function(){ drawPw('find'); });
  if (el('dtOff')) el('dtOff').addEventListener('click', function(){
    el('sheetSub').textContent = '';
    el('sheetList').innerHTML = '<div class="dt-q">Вимкнути автокопію? Остання копія лишиться в інтернеті, її можна буде відновити за паролем.</div>' +
      '<div class="gl-acts"><button type="button" class="btn" id="offNo">Назад</button><button type="button" class="btn pri" id="offYes">Вимкнути</button></div>';
    el('offNo').addEventListener('click', function(){ drawData(); });
    el('offYes').addEventListener('click', function(){ CLOUD.disable(); drawData(); });
  });
  cloudPaint();
  el('dtSave').addEventListener('click', function(){ bodyFlush(); afterSaves(saveCopy); });
  el('dtLoad').addEventListener('click', function(){ el('dtFile').click(); });
  el('dtFile').addEventListener('change', function(){
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var d; try { d = LOCAL.parseFile(String(rd.result)); } catch (e) { el('dtMsg').textContent = errText(e); return; }
      if (!Object.keys(d.days).length && !LOCAL.isEmpty()){ el('dtMsg').textContent = 'У цьому файлі немає записів днів'; return; }
      confirmLoad(d);
    };
    rd.onerror = function(){ el('dtMsg').textContent = 'Не вдалося прочитати файл'; };
    rd.readAsText(f);
  });
}
function saveCopy(){
  var o = LOCAL.exportObj(), name = 'diary-' + LOCAL.today() + '.json';
  var text = JSON.stringify(o, null, 1);
  var done = function(){ store('LastCopy', LOCAL.today()); drawData(); };
  var file = null;
  try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
  // на телефоні — меню «Поділитися» (Диск, Telegram, Файли); на комп'ютері — звичайне завантаження
  var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (touch && file && navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file], title: name }).then(done, function(e){ if (!e || e.name !== 'AbortError') download(); });
    return;
  }
  download();
  function download(){
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    done();
  }
}
function confirmLoad(d, after){
  var ds = Object.keys(d.days).sort(), n = ds.length;
  el('sheetSub').textContent = '';
  el('sheetList').innerHTML =
    '<div class="dt-q">' + (n ? 'У копії ' + n + ' ' + plural(n, 'день', 'дні', 'днів') + ' записів, з ' + esc(fmtDate(ds[0])) + ' ' + ds[0].slice(0, 4) + ' по ' + esc(fmtDate(ds[n - 1])) + ' ' + ds[n - 1].slice(0, 4) + '.' : 'У копії немає записів днів.') +
    '<br>Замінити нею все, що зараз на телефоні?</div>' +
    '<div class="gl-acts"><button type="button" class="btn" id="dtBack">Назад</button><button type="button" class="btn pri" id="dtYes">Замінити</button></div>';
  el('dtBack').addEventListener('click', function(){ drawData(); });
  el('dtYes').addEventListener('click', function(){
    try { LOCAL.replaceAll(d); } catch (e) { drawData(errText(e)); return; }
    if (after) after();
    BODY.data = LOCAL.payload(); BODY.pend = {}; BODY.bad = {}; BODY.msg = ''; BODY.well = null;
    closeSwap(); renderBody();
  });
}
el('dataBtn').addEventListener('click', function(){ bodyFlush(); drawData(); openSheet(); });

/* iPhone у Safari: дані безпечні лише в застосунку з початкового екрана (Safari може стерти їх, а на екран вони не переносяться) */
(function(){
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (!ios || standalone || store('IosHint') === '1') return;
  var d = document.createElement('div');
  d.className = 'ios-hint';
  d.innerHTML = '<p>Спершу додай на початковий екран: <b>Поділитися</b> → <b>На початковий екран</b>. Записуй лише звідти: у Safari дані можуть стертися, а туди вони не переносяться.</p>' +
    '<button type="button" class="sheet-x" aria-label="Закрити"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  el('bodyView').parentNode.insertBefore(d, el('bodyView'));
  d.querySelector('button').addEventListener('click', function(){ store('IosHint', '1'); d.remove(); });
})();

/* ── автокопія: стан і пароль ── */
function cloudPaint(){
  var b = el('dtCloudSt'), s = CLOUD.state(); if (!b || !s) return;
  var t = s.last ? new Date(s.last) : null;
  b.textContent = s.err && s.dirty ? 'Не вдалося надіслати. Спробую ще раз пізніше.'
    : t ? 'Остання автокопія: ' + fmtDate(LOCAL.today().slice(0, 5) + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2)) + ', ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2)
    : 'Автокопія увімкнена';
}
function drawPw(mode){
  var on = mode === 'on';
  el('sheetSub').textContent = on ? 'Придумай довгий пароль, наприклад з трьох-чотирьох слів. Якщо його забути, копію не відкрити: його ніхто не знає і не може скинути.' : 'Введи пароль автокопії.';
  var f = function(id, l, ac){ return '<label class="bd-f"><span>' + l + '</span><div class="w-field"><input type="password" id="' + id + '" autocomplete="' + ac + '" autocapitalize="off" spellcheck="false"></div></label>'; };
  el('sheetList').innerHTML = '<div class="dt-pw">' + f('pw1', 'Пароль', on ? 'new-password' : 'current-password') + (on ? f('pw2', 'Ще раз', 'new-password') : '') + '</div>' +
    '<div class="bd-msg" id="pwMsg" aria-live="polite"></div>' +
    '<div class="gl-acts"><button type="button" class="btn" id="pwBack">Назад</button><button type="button" class="btn pri" id="pwGo">' + (on ? 'Увімкнути' : 'Знайти копію') + '</button></div>';
  el('pw1').focus();
  el('pwBack').addEventListener('click', function(){ drawData(); });
  var go = function(){
    var pw = el('pw1').value, msg = el('pwMsg'), b = el('pwGo');
    if (pw.length < 12){ msg.textContent = 'Пароль — щонайменше 12 символів'; return; }
    if (on && pw !== el('pw2').value){ msg.textContent = 'Паролі не збігаються'; return; }
    b.disabled = true; var lbl = b.textContent; b.textContent = 'Зачекай…'; msg.textContent = '';
    bodyFlush();
    CLOUD.check(pw).then(function(r){
      var copy = null;
      if (r.copy){ try { copy = LOCAL.parseFile(JSON.stringify(r.copy)); } catch (e) { b.disabled = false; b.textContent = lbl; msg.textContent = 'Копію за цим паролем не вдалося прочитати'; return; } }
      var has = copy && Object.keys(copy.days).length;
      var turnOn = function(){ CLOUD.enable(r.keys).then(function(){ if (el('dtCloudSt')) cloudPaint(); }); };
      if (!on){
        if (!copy){ b.disabled = false; b.textContent = lbl; msg.textContent = 'За цим паролем копії немає'; return; }
        confirmLoad(copy, turnOn); return;
      }
      if (has && LOCAL.isEmpty()){ confirmLoad(copy, turnOn); return; }
      if (has){ chooseCopy(copy, turnOn); return; }
      turnOn(); drawData();
    }, function(e){ b.disabled = false; b.textContent = lbl; msg.textContent = errText(e); });
  };
  el('pwGo').addEventListener('click', go);
  each('.dt-pw input', el('sheetList'), function(i){ i.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); }); });
}
/** За цим паролем уже є копія, а на телефоні теж є записи. */
function chooseCopy(copy, turnOn){
  var ds = Object.keys(copy.days).sort();
  el('sheetSub').textContent = '';
  el('sheetList').innerHTML = '<div class="dt-q">За цим паролем уже є копія: ' + ds.length + ' ' + plural(ds.length, 'день', 'дні', 'днів') + ' записів, останній ' + esc(fmtDate(ds[ds.length - 1])) + '.</div>' +
    '<div class="dt-acts" style="margin-top:14px"><button type="button" class="btn pri" id="ccLoad">Відновити записи з копії</button><button type="button" class="btn" id="ccKeep">Замінити копію записами з телефону</button></div>';
  el('ccLoad').addEventListener('click', function(){ confirmLoad(copy, turnOn); });
  el('ccKeep').addEventListener('click', function(){ turnOn(); drawData(); });
}

(function(){ var mt = el('metaTheme'); if (mt) mt.setAttribute('content', getComputedStyle(document.body).backgroundColor); })();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
/* старт: дані з цього браузера */
(function init(){
  if (!BOOT || BOOT.error){ el('bodyView').innerHTML = '<div class="prg-empty">Помилка: ' + esc((BOOT && BOOT.error) || 'Немає даних') + '</div>'; return; }
  BODY.data = BOOT;
  renderBody();
})();
</script>
